nd which failures it survives: RF2, RF3, erasure coding and failure domains in one calculator.",priority:"P0",talk:["Start from raw: the sum of every drive. Protection is the biggest deduction. RF2 keeps 2 copies, so usable is about half of raw; RF3 keeps 3, so about a third.","Erasure coding (EC-X) stores write-cold data as data plus parity, for example 4 data and 1 parity at 1.25x instead of 2x. It only applies to data that is not being overwritten, so the real saving depends on how much of your data is cold.","Keep a rebuild reserve. If a node fails, its data is re-protected onto the free space of the other nodes. A cluster with no free space can survive the failure but cannot heal.","Copies go to different nodes by default. Block and rack awareness spread them across chassis and racks too, so a whole chassis or rack can fail.","Container replication factor and cluster redundancy factor are separate. A redundancy factor 3 cluster can hold both RF2 and RF3 containers.","Moving from RF2 to RF3, or turning on EC-X, is done online. Because it re-lays out data in the background, check capacity first: RF3 needs 50% more physical space for the same data."],numbers:[{k:"RF2",v:"2 copies · at least 3 nodes · tolerates 1 failure"},{k:"RF3",v:"3 copies · at least 5 nodes · tolerates 2 failures"},{k:"Metadata and configuration copies",v:"3 (RF2) · 5 (RF3)"},{k:"EC-X overhead examples",v:"4/1 = 1.25x (vs 2x) · 4/2 = 1.5x (vs 3x)"},{k:"EC-X minimum nodes",v:"4 with RF2 · 6 with RF3"},{k:"Block or rack awareness minimum",v:"3 (RF2) · 5 (RF3) · with EC-X: 4 · 6"},{k:"Rebuild reserve (common sizing guidance)",v:"N+1 for RF2 · N+2 for RF3 or above 24 nodes · a block’s worth with block awareness"}],qa:[{q:"Can I just count on the EC-X savings when I size?",a:"Be careful. EC-X only encodes write-cold data, after it has stayed cold for a while, so the theoretical strip saving is rarely reached. Size on replication-factor capacity and treat EC-X as a bonus until you have measured how or.","Management stays simple: CVM and host default to untagged on the native VLAN. You can tag them, or move backplane traffic onto its own VLAN with network segmentation.","Flow sits on top: overlay VPCs and microsegmentation without new physical VLANs."],numbers:[{k:"Default virtual switch",v:"vs0 (br0 + bond br0-up on every node)"},{k:"Default bond type",v:"Active-Backup (recommended)"},{k:"LACP failure detection",v:"3 missed LACP messages, about 3 s at the fast rate Prism sets"},{k:"Host / CVM internal addresses",v:"192.168.5.1 / 192.168.5.254 on virbr0"},{k:"CVM MTU",v:"1500 (jumbo 9000 allowed on host NICs and guests end to end)"},{k:"Current release checked",v:"AHV 11.2, AOS 7.6"}],qa:[{q:"Do we have to reconfigure our switches?",a:"For Active-Backup, only trunk ports carrying the VLANs you use, with the management VLAN as native. Nothing else. LACP needs dynamic LACP and a LAG, MLAG or vPC on the switches, plus LACP fallback. Each new VLAN-backed network needs that VLAN on the trunks; overlay networks with Flow avoid that."},{q:"Why not use both links all the time?",a:"You can, with LACP: a single VM with several flows can then use both links, though each flow stays on one. It needs switch configuration and changing to it reboots the hosts one by one. MAC pinning (balance-slb) also uses both links without switch config, but Nutanix’s current guidance no longer recommends it because of multicast problems."},{q:"Can we separate storage and management traffic?",a:"Yes, with network segmentation. Backplane traffic between CVMs moves to its own interface (eth2) on a separate VLAN or a separate set of uplinks; RDMA, Volumes and DR traffic can be isolated too. It is not supported on two-node clusters."}],next:["Flow (overlay VPCs and microsegmentation)","LCM Rolling Upgrade (avoid virtual-switch changes during upgrades)","Edge & ROBO"],honest:["Active-Backup, the default, limits each host to one link’s bandwidth; using both links means LACP and switch-side configu  applications up at another site, in order, with one click.",priority:"P0",talk:["Protection is policy-based: you set a recovery point objective (RPO), assign VMs to the policy with categories, and the platform picks the replication tier.","Three tiers: asynchronous at 1 hour or more, NearSync at 1 to 15 minutes, and synchronous at RPO 0 for sites under 5 ms round trip.","The sawtooth is the honest picture: between recovery points, recent writes exist only at the primary. An unplanned failover loses whatever had not reached the other site yet.","Recovery plans are the runbook: boot order in stages, delays, network mapping and scripts. Test failover runs the same plan on clones in an isolated network, so you can prove it works without touching production.","For zero data loss with automatic failover, synchronous replication plus a Witness in a separate fault domain lets the surviving site take over on its own.","Sites can be combined: a nearby synchronous partner plus a distant NearSync or async copy, or a cloud site on Nutanix Cloud Clusters (NC2)."],numbers:[{k:"Asynchronous",v:"RPO 1 hour or more (up to 24 hours)"},{k:"NearSync",v:"RPO 1 to 15 minutes"},{k:"Synchronous",v:"RPO 0, needs under 5 ms round-trip time"},{k:"Automatic failover",v:"Synchronous + Witness in a separate fault domain"},{k:"NC2 clouds",v:"AWS, Microsoft Azure, Google Cloud, OVHcloud"}],qa:[{q:"Why not run everything synchronous and never lose data?",a:"Synchronous replication makes every write wait for the remote site, so it adds roughly one round trip of latency to each write and needs sites under 5 ms apart. Nearby sites can share a regional outage, so it is often paired with a farther asynchronous or NearSync copy."},{q:"Will we really meet a 15-minute RPO?",a:"Only if the link can ship each recovery point before the next one is due. RPO depends on change rate and bandwidth; if the link falls behind, exposure grows past the target. Size bandwidth for peak change rate, and watch for policy a lding, burst capacity without buying hardware, migration without refactoring, and leaving a data center on their own schedule.","Press Play on each use case: the operating model does not change, only where the VMs run.","For containerized apps there is a cloud-native path: NKP manages the Kubernetes fleet, and Cloud Native AOS brings AOS storage into Kubernetes. Today Cloud Native AOS is GA on Amazon EKS only."],numbers:[{k:"NC2 clouds (GA)",v:"AWS, Azure, Google Cloud, OVHcloud"},{k:"NC2 on Google Cloud",v:"GA Dec 9, 2025 · Z3 and C4 bare metal · 17 regions"},{k:"GC2 on AWS GovCloud (US)",v:"Available"},{k:"AWS European Sovereign Cloud",v:"Announced, “later in 2026”"},{k:"Cloud Native AOS",v:"GA on Amazon EKS (1.0, Jul 2025)"}],qa:[{q:"Is NC2 on Google Cloud real, or still a preview?",a:"It became generally available on December 9, 2025, on Z3 and C4 bare-metal instances in 17 regions. One card on the NC2 product page still says preview; the GA announcement and the NC2 FAQ are the current statements."},{q:"Do we have to change our applications to run them on NC2?",a:"No. VMs run on the same AHV hypervisor, so they move as they are; with the right network design they can keep their IP and MAC addresses. Modernizing to native cloud services can come later, app by app."},{q:"Can we use Cloud Native AOS on AKS or GKE?",a:"Not confirmed today. Cloud Native AOS 1.0 is generally available on Amazon EKS. Bare-metal support is tied to NKP Metal, which was in early access with a 2H 2026 target. Check current status before planning."}],next:["Disaster Recovery","Migration with Nutanix Move","Cloud Native AOS"],honest:["Bare-metal cloud instances are billed while they run, whether or not they are busy; size a DR cluster for steady state and plan how it grows on failover.","Instance types, regions and features differ between clouds and change often; confirm for your target region.","Network design (connectivity to on-premises, IP ranges, egress costs) is usually the long pole of an NC2 project.","The cloud-native path has narrower availability today: Cloud Native AOS is GA on EKS only."]},Yi=[{content:Il,Component:Dl,icon:"layers",parent:""},{content:Ac,Component:Cc,icon:"server",parent:"nci"},{content:jc,Component:qc,icon:"zap",parent:"nci"},{content:nd,Component:td,icon:"shield",parent:"nci"},{content:dd,Component:cd,icon:"power",parent:"nci"},{content:Od,Component:xd,icon:"upgrade",parent:"nci"},{content:qd,Component:Hd,icon:"net",parent:"nci"},{content:lh,Component:ih,icon:"lock",parent:"nci"},{content:Ah,Component:wh,icon:"globe",parent:"nci"},{content:Eh,Component:Oh,icon:"clone",parent:"nci"},{content:zh,Component:Dh,icon:"shield",parent:"nci"},{content:qh,Component:Uh,icon:"move",parent:"nci"},{content:eu,Component:Jh,icon:"edge",parent:"nci"},{content:ou,Component:tu,icon:"plus",parent:"nci"},{content:bu,Component:vu,icon:"api",parent:""},{content:ju,Component:qu,icon:"gauge",parent:""},{content:lp,Component:ip,icon:"k8s",parent:""},{content:gp,Component:fp,icon:"eye",parent:""},{content:Pp,Component:Np,icon:"file",parent:""},{content:Dp,Component:Ep,icon:"k8s",parent:""},{content:qp,Component:Up,icon:"db",parent:""},{content:tm,Component:em,icon:"ai",parent:""},{content:rm,Component:om,icon:"beacon",parent:""},{content:dm,Component:cm,icon:"cloud",parent:""}];function Qi(t){return Yi.find(n=>n.content.path===t)}const hm=[{term:"AHV",full:"Nutanix AHV hypervisor",def:"Nutanix’s own hypervisor, built on Linux KVM. It runs the virtual machines on each node and is managed through Prism."},{term:"AOS",full:"Acropolis Operating System",def:"The Nutanix software that turns a group of servers into one cluster: storage, data protection, management services and APIs."},{term:"Autopathing / iSCSI redirector",def:"If the storage controller (CVM) on a host stops, that host’s VMs keep running and their storage I/O is redirected over the network to CVMs on other nodes. On ESXi and Hyper-V this is called autopathing; on AHV the iSCSI redirector does it."},{term:"Block",def:"A physical chassis that holds one to four nodes. Block awareness keeps copies of data in different blocks so a whole-chassis failure loses nothing."},{term:"Category",def:"A key/value tag (for example AppTier: Web) attached to VMs. Flow security policies and DR protection policies target categories instead of IP addresses or VM names."},{term:"Cluster",def:"A group of nodes managed as one system. Storage from every node is pooled and protected across the whole cluster."},{term:"Curator",def:"The AOS background service that scans metadata and runs cluster-wide jobs: re-protecting data after failures, disk balancing, tiering, erasure coding and cleanup."},{term:"CVM",full:"Controller VM",def:"A virtual machine on every node that runs the AOS services. Together the CVMs form the distributed storage controller, so storage performance and capacity grow with each node."},{term:"Data locality",def:"A VM’s data is kept on the node where the VM runs, so reads are served locally without crossing the network. After a VM moves, data it reads is gradually copied to its new node."},{term:"DSF",full:"Distributed Storage Fabric",def:"The storage layer of AOS. It pools the local drives in every node into one storage pool and keeps multiple copies (or parity) of every piece of data on different nodes."},{term:"EC-X",full:"Erasure coding",def:"Saves capacity on write-cold data by replacing full copies with parity spread across nodes. A 4/1 strip needs 1.25x the space instead of 2x for two full copies."},{term:"Extent / extent group",def:"The units AOS uses to store and track data. Placement and protection are managed per extent group, which is why recovery can target exactly the data that lost a copy."},{term:"Flow",def:"Nutanix software-defined networking and security: microsegmentation (Flow Network Security) and overlay virtual networks / VPCs (Flow Virtual Networking)."},{term:"HA",full:"High availability",def:"If a host fails, its VMs are restarted on the surviving hosts. With memory reservation enabled, enough capacity is held back to guarantee those restarts."},{term:"ILM",full:"Information lifecycle management",def:"Moves data between storage tiers based on how often it is used: hot data on the fastest media, cold data on capacity media."},{term:"LCM",full:"Life Cycle Manager",def:"The upgrade tool in Prism. It inventories software and firmware, picks a safe order, runs pre-checks and upgrades one node at a time while workloads keep running."},{term:"Metro Availability",def:"Synchronous replication between two sites close enough (low round-trip latency) that every write is committed at both before it is acknowledged, for zero data loss."},{term:"NC2",full:"Nutanix Cloud Clusters",def:"The same Nutanix stack (AOS and AHV) running on bare-metal instances in a public cloud, managed with the same tools as on-premises clusters."},{term:"NCM",full:"Nutanix Cloud Manager",def:"Operations, automation, cost governance and security compliance on top of the platform. Feature availability depends on license tier."},{term:"NDB",full:"Nutanix Database Service",def:"Database provisioning, patching, cloning and point-in-time recovery as a service, built on AOS snapshots and log capture."},{term:"NKP",full:"Nutanix Kubernetes Platform",def:"Nutanix’s platform for deploying and managing fleets of Kubernetes clusters across data center, edge and cloud."},{term:"Node",def:"One server: CPU, memory, drives and network, running a hypervisor plus a CVM."},{term:"OpLog",def:"A fast write buffer on each CVM for bursty random writes. Writes land there, are copied to other nodes, are acknowledged, and are later drained to the extent store in large sequential chunks."},{term:"Prism Central",def:"The management console for many clusters. It runs as one VM or a small scale-out set of VMs and hosts multi-cluster features."},{term:"Prism Element",def:"The management interface built into every cluster. It manages that one cluster."},{term:"Rack awareness",def:"Keeps copies of data in different racks so losing a whole rack (power or top-of-rack switch) does not lose data."},{term:"RF",full:"Replication factor",def:"How many full copies of data the cluster keeps. RF2 keeps two copies on different nodes and survives one failure; RF3 keeps three and survives two."},{term:"RPO",full:"Recovery point objective",def:"The most data you can afford to lose, measured in time. An RPO of 1 hour means a recovery may lose up to the last hour of changes."},{term:"RTO",full:"Recovery time objective",def:"How long it may take to get an application running again after a disaster."},{term:"Stargate",def:"The AOS service that handles all storage I/O for its node: it receives VM reads and writes, manages caches and replicates writes to other CVMs."},{term:"vDisk",def:"A virtual disk as AOS sees it: any file over a small size that a VM or service reads and writes, such as a VM’s disk."},{term:"Witness",def:"A small VM at a third location that arbitrates when two sites (or a two-node cluster’s nodes) lose contact, so the right side keeps running automatically."},{term:"Zookeeper",def:"Stores the cluster’s configuration. It runs on 3 nodes (5 at redundancy factor 3) and needs a majority of them up to operate."}],um=[{id:"fed",title:"Prism Federation",sub:"API | Alerts | LCM | IAM",path:"central",params:{tab:"fed"}},{id:"ncm",title:"Cloud Manager",sub:"AIOps | Self-Service | Cost | SecOps",path:"ncm"},{id:"nkp",title:"Kubernetes Platform",sub:"LCM | Fleet Management | Security",path:"nkp"},{id:"lens",title:"Data Lens",sub:"Security | Privacy",path:"datalens"}],pm=[{id:"files",title:"Files, Objects",path:"storage"},{id:"cnaos",title:"Cloud Native AOS",path:"cnaos"},{id:"ndb",title:"Database Service",path:"ndb"},{id:"ai",title:"Enterprise AI",path:"ai"}],mm=[{id:"aws",title:"AWS",path:"cloud",params:{c:"aws"}},{id:"azure",title:"Azure",path:"cloud",params:{c:"azure"}},{id:"gcp",title:"Google Cloud",path:"cloud",params:{c:"gcp"}}]
