e space for the third copy.","Erasure coding tab: data that has not been overwritten for a while is encoded in the background into a strip of data and parity pieces, each on a different node, and its extra copies are deleted. A lost piece is recomputed from the rest of its strip.","Be precise about the saving: a 4/1 strip uses 1.25 times the space instead of 2 times, but only for write-cold data, so the blended saving depends on how much of the data stays cold.","Blocks and racks tab: start with Node only to show the risk, a piece whose two copies share a chassis, then switch to Block and Rack to show a whole block or rack failing with nothing unavailable.","Present the numbers on this page as sizing guidance, not guarantees: RF overhead, EC-X savings and the rebuild reserve depend on the design, and the node, block and rack minimums can change with the AOS version, so confirm them for a real design."],numbers:[{k:"RF2",v:"2 copies · at least 3 nodes · tolerates 1 failure"},{k:"RF3",v:"3 copies · at least 5 nodes · tolerates 2 failures"},{k:"Metadata and configuration copies",v:"3 (RF2) · 5 (RF3)"},{k:"EC-X overhead examples",v:"4/1 = 1.25x (vs 2x) · 4/2 = 1.5x (vs 3x)"},{k:"EC-X minimum nodes",v:"4 with RF2 · 6 with RF3"},{k:"Block or rack awareness minimum",v:"3 (RF2) · 5 (RF3) · with EC-X: 4 · 6"},{k:"Rebuild reserve (sizing guidance)",v:"RF2: the largest node (N+1) · RF3: the two largest (N+2) · with block awareness, a whole block per failure tolerated"},{k:"Resilient capacity (Prism)",v:"Total capacity minus the space a rebuild needs; Prism warns at 75% of it by default"}],qa:[{q:"Can I just count on the EC-X savings when I size?",a:"Be careful. EC-X only encodes write-cold data, after it has stayed cold for a while, so the theoretical strip saving is rarely reached. Size on replication-factor capacity and treat EC-X as a bonus until you have measured how much of your data is cold."},{q:"Why reserve a whole node of free space?",a:"After a node failure, the cluster re-creates the missing copies on the remaining nodes. That needs free space equal to what the failed node held, so size for the largest node (the two largest with RF3). Without it, data stays available but runs with fewer copies until you add capacity, Prism raises an alert, and upgrade pre-checks can hold back an upgrade. Prism shows the safe limit as resilient capacity, and an optional Reserve Rebuild Capacity setting keeps that space from being filled."},{q:"Does erasure coding slow anything down?",a:"Encoding runs in the background on data that has gone cold, so new writes are not affected. Rebuilding an encoded piece reads the rest of its strip, which is more work than copying a replica; that is one reason standard clusters top out at 4/1 and 4/2 strips. Inline erasure coding also exists, for example for Nutanix Objects."},{q:"Is block awareness automatic?",a:"Placement keeps copies in different blocks once the cluster has enough blocks: at least 3 with RF2 and 5 with RF3, plus one more of each with erasure coding. Below that, copies are kept on different nodes only. Rack awareness needs the administrator to tell the cluster which rack each block is in."},{q:"Do I need RF3?",a:"RF3 tolerates two simultaneous failures, at the cost of a third copy and more write work. It is common for large clusters and data where the risk window during a rebuild matters. Many clusters run RF2 with block awareness and a rebuild reserve. It is a risk decision, not a default."}],next:["RF2 opens on 3 nodes, the smallest standard cluster: let one loop play and point out that no node ever holds two copies of the same shape.","Watch the node fail: every shape still has a copy somewhere, then the healthy nodes re-create the missing copies together.","Switch to RF3: it moves to 5 nodes, its minimum, with three copies of each shape, and two nodes can fail at once.","Pick 8 nodes and read the capacity bar: your data, the extra copies, and a smaller share kept free for a rebuild.","Era "For the network team, a new project on VPCs needs no new VLAN, trunk, gateway or unique IP range."],numbers:[{k:"Policy types",v:"Application, Isolation, Quarantine (Strict or Forensic), Shared Services, VDI (by release)"},{k:"Current release (Oct 2026)",v:"Flow Network Security Next-Gen 7.6, bundled with AOS 7.6 and pc.7.6; adds rule-centric and FQDN-based policies"},{k:"Policy states",v:"Saved, Monitoring, Enforced"},{k:"Overlay encapsulation",v:"Geneve between AHV hosts (VTEP gateways use VXLAN)"},{k:"Geneve overhead",v:"58 bytes; guest MTU 1442 if the network cannot carry jumbo frames"},{k:"External networks",v:"NAT (source NAT + floating IPs) or routed (no NAT)"}],qa:[{q:"Do we need agents in the VMs?",a:"No. Flow Network Security is agentless: it runs in the AHV virtual switch. That also means it protects VMs on AHV; workloads elsewhere need their own controls."},{q:"Will turning on microsegmentation break our applications?",a:"It can if you enforce rules you have not validated. That is why policies start in Monitoring: traffic keeps flowing while the log shows what would be blocked. Fix the rules, then enforce."},{q:"Do overlay networks replace VLANs?",a:"Not necessarily. Both can run on the same cluster. VPCs suit self-service projects, overlapping ranges and multi-tenant setups; VLAN-backed subnets still fit workloads that must sit on an existing physical segment. VPCs need Prism Central with the Network Controller and an external VLAN for traffic in and out."},{q:"Is this the older Flow or Flow Network Security Next-Gen?",a:"The ideas shown here are the same in both: rules on categories, Monitoring before Enforced, and quarantine. Next-Gen is the current generation. It runs through the Network Controller in Prism Central, lets a VM belong to several policies with any category, and from 7.6 adds rule-centric and FQDN-based policies. Clusters still on the legacy generation (Flow Microsegmentation) need a planned upgrade, and moving existing policies is a separate step."}],next:["Network Security with Policy Off: app traffic flows and every unwanted try gets through. Switch to Monitor: the same tries are flagged in the log but still get through. Then Enforce: each one is stopped at the VM.","Turn on Quarantine Web-2: nothing gets in or out of Web-2, even with the policy Off, while Web-1 keeps the app running.","Virtual Networking, Inside a VPC: two VPCs use the very same addresses, and each packet crosses between hosts in an envelope tagged with its VPC.","Out to the internet, then In from the internet: source NAT gives a whole VPC one public address, and a floating IP lets outsiders reach one VM.","Open Data Security to see where Flow fits with encryption and hardening."]},ks=["Database","App","Web"],hu=.4,C0=8.6,N0={async:{first:2,every:3.4,travel:1.1},nearsync:{first:.9,every:1,travel:.5},metro:{first:0,every:0,travel:.2}},_0=1,uu=1,V0=1,P0=2.2,T0=.7,E0=.5,O0=2.2,Mt=e=>Math.round(e*1e3)/1e3;function D0(e,t){const n=N0[e],s=C0,a=[];for(let u=1;u*hu<s-.5;u++)a.push({t:Mt(u*hu),atB:1/0,lost:!1,ship:-1});const r=[],i=(u,m)=>{const y=a.map((x,v)=>x.ship===-1&&x.atB===1/0&&x.t<=u+1e-9?v:-1).filter(x=>x>=0);if(!y.length)return;const g=Mt(u+n.travel);for(const x of y)a[x].ship=r.length,a[x].atB=g;r.push({t:Mt(u),land:g,writes:y,final:m,lost:!1})};if(e==="metro")for(const u of a)u.atB=Mt(u.t+n.travel);else for(let u=0;n.first+u*n.every<s;u++)i(n.first+u*n.every,!1);let l,d;const f=[{id:"replicate",t:0}],p=e==="metro"&&t==="planned";if(p)d="scheduled",l=s,f.push({id:"migrate",t:s});else if(t==="planned"){d="scheduled";const u=s+_0;i(u,!0),l=Mt(Math.max(u,...a.map(m=>m.atB))),f.push({id:"shutdown",t:s},{id:"final",t:Mt(u)})}else{d=e==="metro"?"witness":"person";for(const u of a)u.atB>s&&Object.assign(u,{atB:1/0,lost:!0});for(const u of r)u.land>s&&(u.lost=!0);l=Mt(s+uu+(d==="witness"?V0:P0)),f.push({id:"lost",t:s},{id:"decide",t:Mt(s+uu)})}const h=ks.map((u,m)=>Mt(l+.3+m*T0)),c=Mt(h[h.length-1]+E0);return p||f.push({id:"boot", ed."})})]})}const H0={path:"nci/dr",title:"Disaster Recovery",tag:"Nutanix Cloud Infrastructure",summary:"Pick how much data you can afford to lose (the RPO), and the protection policy chooses the replication tier. Recovery plans then bring applications up at another site, in order, with one click.",priority:"P0",talk:["Protection is policy-based: you set a recovery point objective (RPO), assign VMs to the policy with categories, and the platform picks the replication tier.","Three choices on screen, each with an RPO target: asynchronous at 1 hour or more; NearSync at 1 to 15 minutes, or synchronous at RPO 0 for sites under 5 ms round trip; and Metro Availability.","The honest picture: between copies, recent writes exist only at the primary site. An unplanned failover loses whatever had not reached the other site yet.","Recovery plans are the runbook: boot order in stages, delays, network mapping and scripts. Test failover runs the same plan on clones in an isolated network, so you can prove it works without touching production.","Metro Availability is for zero data loss with automatic failover: synchronous replication between sites under 5 ms round trip, plus a Witness in a third location. If a site is lost, the Witness gives the other site the lock and the VMs restart there on their own. It is a restart, not live continuity; for a planned move, the VMs can live-migrate and never stop.","Sites can be combined: a nearby synchronous partner plus a distant NearSync or async copy, or a cloud site on Nutanix Cloud Clusters (NC2)."],numbers:[{k:"Asynchronous",v:"RPO target of 1 hour or more (up to 24 hours)"},{k:"NearSync",v:"RPO target of 1 to 15 minutes"},{k:"Synchronous",v:"RPO 0, needs under 5 ms round-trip time; failover is started by a person"},{k:"Metro Availability",v:"Synchronous + a Witness in a third location: automatic failover, VMs restart at the surviving site (minutes)"},{k:"NC2 clouds",v:"AWS, Microsoft Azure, Google Cloud, OVHcloud"}],qa:[{q:"Why not run everything synchronous and never lose data?",a:"Synchronous replication makes every write wait for the remote site, so it adds roughly one round trip of latency to each write and needs sites under 5 ms apart. Nearby sites can share a regional outage, so it is often paired with a farther asynchronous or NearSync copy."},{q:"Will we really meet a 15-minute RPO?",a:"Only if the link can ship each recovery point before the next one is due. RPO depends on change rate and bandwidth; if the link falls behind, exposure grows past the target. Size bandwidth for peak change rate, and watch for policy alerts."},{q:"What if only the link between the sites breaks?",a:"With Metro Availability the Witness settles it: the site that gets its lock keeps running the VMs, and replication pauses instead of failing over, so the VMs never run in both places. On AHV an administrator resumes replication once the link is back. If a site loses both the other site and the Witness, it stops its VMs so the other site can take over safely."},{q:"Is Metro Availability the same on AHV and ESXi?",a:"The result is the same, RPO 0 with automatic failover, but it is built differently. On AHV it is a synchronous protection policy in Prism Central with automatic failure detection, the Witness and a recovery plan, across two clusters. On ESXi it stretches a storage container across the sites inside one vSphere cluster, and vSphere HA restarts the VMs."},{q:"How do we know failover will work when we need it?",a:"Run test failovers regularly. They start the recovery plan on clones in an isolated network, so production keeps running. That is also where you catch missing network mappings or boot-order mistakes."}],next:["Async, unplanned: pause just before Site A is lost and point at the writes that exist only at Site A.","Switch to NearSync / Sync, then Metro Availability: the data that could be lost shrinks from hours to minutes to none, and with Metro the Witness starts the failover on its own.","Planned he VM down?",a:"Taking a snapshot does not copy data, and writes after it go to new blocks without copying the old ones aside. The system still manages snapshot metadata in the background, so keep retention to what you need. Effects depend on workload and version."},{q:"How much space will my clones use?",a:"As much as they change. A clone that rewrites 10% of its disk uses about 10% of the disk’s size in new space, times the replication factor. A clone that rewrites everything ends up as large as a full copy."}],next:["Let one loop play and pause on the snapshot: the number of stored blocks does not change.","Pause after the new writes: only the changed blocks add space, and the snapshot still points at the old ones.","Pause on the clones: each shares every block until it writes its own.","Then open Database Service for database clones built on the same mechanism, or Disaster Recovery for copying snapshots to another site."]},Tm={off:"Off",native:"On · built-in key manager",ext:"On · external key manager"},Pc={drive:"A drive is stolen",node:"A whole node is stolen"},Da=3,gi=3,rv=3,iv=Da*gi*rv,lv=.3,cv=.09,dv=.8,wi=4,vu=5.4,Tc=5.6,hv=9.4,uv=960,pv=366,Wt={x:300,y:42},ee={x:262,y:62,w:76,h:32},Ce={x:10,y:54,w:580,h:244},yt={y:106,w:176,h:180},mn=e=>24+e*190,rt={dx:12,w:152,h:40},Xa=e=>yt.y+32+e*48,vt={x:630,y:106,w:320,h:256},Ye={x:630,y:58,w:320,h:40},fn=2,Ra=1,Fr={x:vt.x+(vt.w-rt.w)/2-(mn(fn)+rt.dx),y:196-Xa(Ra)},Lr={x:vt.x+(vt.w-yt.w)/2-mn(fn),y:142-yt.y},Et=8;function Em(e,t){return e==="off"?{tone:"bad",word:"Readable",k:"Readable",mark:"✕ Readable: data is stored as written",text:t==="drive"?"The drive holds data exactly as it was written. Anyone who has it can read it.":"Every drive in the node holds data exactly as it was written. Anyone who has the node can read it."}:t==="drive"?{tone:"ok",word:"Unreadable",k:"Unreadable",mark:"✓ Unreadable: scrambled, no key on it",text:"The drive holds only scrambled data and the keys are not on it, so it is useless to wh rives, which Nutanix positions for most cases, or self-encrypting drives (SEDs) when policy requires hardware encryption. They can be layered (dual encryption).","Apps see no change: data is encrypted before it reaches a drive and decrypted for any authorized reader.","Keys can be managed natively by the cluster, with no extra server, or by your existing external key manager, so keys and data never sit in the same place. That is what protects you if a whole node walks out.","Beyond encryption, hardening is built in. With AOS 7.6, Prism Central 7.6 and AHV 11.2, a security profile (Standard, Elevated or Strict) is applied from Prism Central and checked every 2 hours. Drifted settings are put back where possible; a change that would need a host reboot raises an alert instead."],numbers:[{k:"Encryption options",v:"Software (AOS), self-encrypting drives, or both"},{k:"Key management",v:"Native (on the cluster) or external key manager; options vary by release and configuration"},{k:"Software encryption module",v:"FIPS 140-2 Level 1 (per Nutanix); check the current certificate for your release"},{k:"Security profiles",v:"Standard, Elevated, Strict (AOS 7.6, PC 7.6, AHV 11.2; AOS layer only on other hypervisors)"},{k:"Drift check",v:"Every 2 hours; fixed automatically where possible, otherwise an alert"}],qa:[{q:"Do we need self-encrypting drives?",a:"Usually not. Software encryption works on standard drives and is what Nutanix positions for most use cases. SEDs make sense when a policy or regulation specifically requires hardware-based encryption."},{q:"Does encryption protect us from ransomware?",a:"No. Ransomware writes through the VM like any application, so its output is simply stored, encrypted at rest like everything else. Defend with microsegmentation (Flow), detection on file shares (Data Lens) and good recovery points (snapshots and DR)."},{q:"Will this pass our compliance audit?",a:"It helps, but no product makes you compliant on its own. Nutanix publishes a STI wered resiliency. A drive failure can be rebuilt inside the node, but a node outage is site downtime, so plan backup or replication.","Two nodes plus a small Witness VM at another site, set up as Nutanix supports: survives a node failure. The survivor switches to single-node mode and keeps two copies of data on its own drives, if it has room. Getting back to two-node mode takes a while, so be honest about that.","Three nodes: the standard RF2 cluster. It self-heals after a node failure if there is free capacity, and upgrades roll with no VM downtime.","Every site runs on its own, even if the WAN drops. Prism Central in the data center manages them all as a fleet, including LCM upgrades.","Growing a site is where small clusters differ: from AOS 7.6 a two-node AHV cluster can add a third node, one way. A single node can’t be expanded; the path is a new cluster."],numbers:[{k:"Two-node switch to single-node mode",v:"Typically 30–60 s with the Witness reachable (guest disk timeout of at least 60 s recommended)"},{k:"Two-node return to two-node mode",v:"Typically 15 min of steady heartbeat, then a resync that can take hours"},{k:"Two-node sizing",v:"Run on one node: disk and memory at about 40% or less"},{k:"Two-node copies",v:"Data 2 copies (one per node), metadata 4 copies"},{k:"Single-node async DR",v:"6-hour RPO only, per Nutanix guidance (check your release)"},{k:"Adding a node",v:"1 node: not supported · 2 nodes: to three from AOS 7.6 on AHV · 3 nodes: Expand Cluster"}],qa:[{q:"Is a two-node cluster as resilient as three nodes?",a:"It survives a single node failure, which is the main point. The differences: it relies on a Witness at another site for automatic failover, the return to two-node mode after a repair can take hours of resync, it must be sized so one node can carry the site, and some features (such as network segmentation) are not supported."},{q:"What happens if the WAN goes down?",a:"The site keeps running its VMs and can be managed locally through Pris ons also forecasts capacity runway, so purchases are planned rather than reactive, and suggests right-sizing for over- and under-sized VMs.","Self-Service: app teams order from a catalog; quota and approval policy are checked before anything is created, and the result arrives with owner, project and categories set. Over quota, the request is sent back with the reason.","Cost: dev-test runs hot. Cost Governance meters it daily at your rates, sends the owner an overspend alert against the budget while there is time to act, and lists the idle and oversized VMs to stop or right-size. Self-Service stops it coming back: the project quota caps what dev-test can deploy, and approval and scheduler policies hold big requests and stop dev-test apps at night. From NCM 2.0, Cost Governance runs entirely on-premises.","Security Compliance scans settings against a baseline, suggests a fix for each finding, and catches drift when someone changes a setting by hand. Tiers matter: Starter covers forecasting and right-sizing, Pro adds Cost Governance and Self-Service, Ultimate adds multi-VM blueprints, approvals and Security Compliance."],numbers:[{k:"NCM components",v:"Intelligent Operations · Self-Service · Cost Governance · Security Compliance"},{k:"Self-Service & Cost Governance",v:"From NCM Pro"},{k:"Security Compliance, multi-VM blueprints, approvals",v:"NCM Ultimate"},{k:"NCM 2.x",v:"2.0 GA Apr 2026 · 2.1 GA Aug 2026 · requires Nutanix Central on-prem"},{k:"Small form factor (NCM 2.1)",v:"3 nodes, about 2,500 VMs"},{k:"Medium form factor (NCM 2.0)",v:"About 10,000 VMs"}],qa:[{q:"Does cost data go to a Nutanix cloud service?",a:"Not in NCM 2.x. From NCM 2.0, Cost Governance runs fully on-premises inside your data center, without a separate SaaS application. Older Beam deployments were SaaS, so check which version you are comparing."},{q:"Does a budget stop the spending by itself?",a:"Not as far as the published material says. Cost Governance budgets track spend and send overspend alerts, and its recommendations show what to stop or right-size; we found no budget setting that switches resources off. The hard limit is the Self-Service project quota, which caps the CPU, memory and storage a project can deploy, with approval and scheduler policies on NCM Ultimate."},{q:"Can it manage our VMware estate too?",a:"NCM 2.x spans multiple Prism Centrals and VMware vCenters, and Intelligent Operations Starter lists ESXi on non-Nutanix infrastructure. Feature coverage differs between AHV and vCenter-managed environments, so map your use cases to the current feature matrix."},{q:"Which license do we need for the self-service portal?",a:"NCM Pro gives the marketplace, single-VM blueprints and runbooks. Multi-VM application blueprints and approval workflows need NCM Ultimate."}],next:["AIOps: pause on the 3 a.m. spike, flagged by the learned band while the fixed 70% alarm stays silent, then on the 2 p.m. spike, which both catch.","Self-Service: 3-tier web app for the approval step, then App over quota to show a request sent back before anything is created.","Cost: pause on each numbered step (the alert, the recommendations, the quota and policies) and compare where the month ends with the left-alone line.","SecOps: watch findings get fixed, then a setting changed by hand caught by the next scan.","Then open Nutanix Central & Prism Federation, where NCM 2.x runs."]},Nn=[{id:"e1",name:"store-01",site:"edge",infra:"ahv",cp:1,workers:2},{id:"e2",name:"store-02",site:"edge",infra:"ahv",cp:1,workers:2},{id:"e3",name:"store-03",site:"edge",infra:"ahv",cp:1,workers:2},{id:"d1",name:"dc-prod",site:"dc",infra:"ahv",cp:3,workers:4},{id:"d2",name:"dc-vsphere",site:"dc",infra:"vsphere",cp:3,workers:3},{id:"c1",name:"aws-prod",site:"cloud",infra:"aws",cp:3,workers:3}],js={node:360,check:240},_o=.4,ds=.8;function oy(e=Nn){const t=["edge","dc","cloud"],n=e.slice().sort((i,l)=>t.indexOf(i.site)-t.indexOf(l.site)),[s,...a]=n,r=s?[[s]]:[];for(const i of t){const l=a.filter( ese limits belong to release 1.0, so check the current release notes. Bare metal comes through NKP Metal, early access with GA targeted for the second half of 2026; moving apps to and from bare metal is listed as future development."],numbers:[{k:"Announced",v:"May 2025 (.NEXT 2025)"},{k:"Release 1.0.0",v:"July 2025, Amazon EKS only"},{k:"1.0 limits",v:"Up to 15 worker nodes, RF2, up to 64 volumes per node"},{k:"1.0 storage",v:"EBS gp3 volumes on i3en, i4i, m6id or m5d workers"},{k:"DR in 1.0",v:"Through NDK, target RPO 1 hour or more; across AWS regions and zones, and from NKP on Nutanix (AHV) to EKS"}],qa:[{q:"Why not just use EBS or the cloud’s own database service?",a:"A cloud database service runs only in that provider’s cloud and is managed separately from the Kubernetes app, as Nutanix puts it. Cloud Native AOS keeps the database in Kubernetes with Nutanix snapshots, compression and two copies of every write, and NDK protects and replicates the app and its data as one unit."},{q:"Can we run it on AKS or GKE?",a:"Not confirmed. Release 1.0 supports Amazon EKS, and Nutanix says the first version is licensed for AWS only. Azure and Google Cloud were mentioned as intentions in 2025 press coverage, so do not plan on them yet."},{q:"Can we run it on our own bare-metal servers today?",a:"Not as a generally available product. NKP Metal, announced as early access in April 2026 with GA targeted for the second half of 2026, offers Cloud Native AOS as its storage option. NKP Pro and Ultimate can already run Kubernetes on pre-provisioned bare metal, with Nutanix storage through a CSI driver."},{q:"Is this the same as Project Beacon?",a:"Related. Project Beacon was the 2023 vision of data services that run anywhere. Cloud Native AOS, together with NDK, is the first concrete product from that direction."}],next:["Start on Amazon EKS and let the loop run: AOS lands as a pod on each worker, the database writes two copies, a worker fails, and NDK snapshots and replicates the a oday. Cloud Native AOS 1.0 is generally available on Amazon EKS. Bare-metal support is tied to NKP Metal, which was in early access with a 2H 2026 target. Check current status before planning."}],next:["Start with disaster recovery on AWS: replication, the site going down, and the VMs powering on in the cloud.","Switch to burst capacity to show cloud nodes added for a peak and released afterwards.","Switch to data-center exit to show workloads moving in waves and the building being retired.","Change the cloud to Azure or Google Cloud: the picture stays the same, which is the point.","Then Disaster Recovery for the policies, Migration with Nutanix Move for the move itself, or Cloud Native AOS for containers."]},xt=[0,3,6,9.4,13.4],Fp=15.8,Lp=["vSphere stays","A CVM on every host","One shared datastore","Upgrade a host","Back in service"],ao={out:9.4,down:10.2,up:12.4,back:xt[4]},Cb=[0,2,3],Wa=2,ss=[0,2.8,2.8+Wa,2.8+2*Wa,2.8+3*Wa,2.8+4*Wa],Wp=ss[5]+3.4,Hp=["Start from ESXi","Host 1 converts","Host 2 converts","Host 3 converts","Host 4 converts","One AHV cluster"],zp=["Each node runs VMware ESXi, and vCenter manages the VMs as before: vMotion, HA and DRS keep working.","Each host also runs one Nutanix Controller VM (CVM). The host’s drive controller is passed straight through to it (VMDirectPath I/O), so the CVM owns the drives.","The CVMs pool every host’s drives into one datastore that ESXi mounts over NFS. There is no SAN or vSAN to run, and AOS storage comes with the Nutanix license.","Prism upgrades one host at a time: vMotion moves its VMs off, the host and its CVM go into maintenance, and the other CVMs keep serving all the data.","The host rejoins, its VMs move back, and Prism moves on to the next host. The Nutanix storage stack can also be upgraded on its own, without touching ESXi."],Gp=e=>e===0?"This cluster runs ESXi on Nutanix today: vCenter manages the VMs and the CVMs serve the storage. For an in-place conversion, vCenter has to run outside the cluster." ng points, and why each one appeals.","External storage: keep the array. AHV runs on compute-only nodes that reach Everpure FlashArray or Dell PowerStore over NVMe/TCP, or Dell PowerFlex through Dell’s own client. Each VM disk is its own volume on the array, and Nutanix uses the array’s snapshots and clones. NetApp ONTAP, over NFS, is announced and on the page, marked as such.","The value is reuse and independent scaling: leave vSphere without a storage refresh, add compute nodes without buying storage, and keep Prism, Flow and DR orchestration on top. It is licensed per core as NCI Compute.","ESXi on Nutanix: keep vSphere. vCenter, vMotion, HA and DRS keep working; a Controller VM on every host owns the drives and pools them into one datastore. There is no SAN to run, and the customer uses their existing VMware licenses.",'It is also a stepping stone. Switch to "Convert to AHV later": the hosts change hypervisor one at a time in place, or teams move with Nutanix Move or a DR failover. Replication already works between ESXi and AHV clusters.',"Be precise on availability: NetApp ONTAP was announced in April 2026 and isn’t generally available yet, FlashArray needs a new Nutanix cluster, and Flow and NC2 need AHV."],numbers:[{k:"Arrays generally available",v:"Dell PowerFlex (Apr 2025), Everpure FlashArray (Dec 2025), Dell PowerStore (NCI 7.6, Jul 2026)"},{k:"Announced, not yet GA",v:"NetApp ONTAP (AFF A-series, select FAS) over NFS, planned for an upcoming NCI release"},{k:"Array protocol",v:"NVMe/TCP on Ethernet; PowerFlex uses Dell SDC; NetApp uses NFS"},{k:"FlashArray cluster",v:"3 to 32 nodes, one FlashArray, new cluster only"},{k:"External storage license",v:"NCI Compute (NCI-C), priced per core"},{k:"ESXi cluster size",v:"Up to 48 hosts (vSphere 7.0, AOS 6.8)"},{k:"vSphere 8 end of general support",v:"October 2027, as Nutanix states it"}],qa:[{q:"Can we use our NetApp array?",a:"Not yet. Nutanix and NetApp announced ONTAP support over NFS in April 2026, for AFF A-series and some FAS systems, and in mid-October 2026 it was still planned for this fall with an upcoming NCI release (NetApp’s own blog names NCI 7.6.0.10). Pick it on the page to walk through it; the numbers mark it as announced. Today the generally available arrays are Everpure FlashArray, Dell PowerStore and Dell PowerFlex."},{q:"Can we attach our existing Nutanix cluster to the array?",a:"Not with FlashArray: Everpure documents it as a new (greenfield) Nutanix cluster only, though the array itself can be one you already own. For PowerStore and PowerFlex we haven’t found a published answer, so check before planning on it."},{q:"Is ESXi on Nutanix still supported after Broadcom’s changes?",a:"Yes. Nutanix still lists ESXi as a supported hypervisor and says you can keep running vSphere on premises with your existing VMware licenses; Broadcom now sells vSphere as VVF or VCF subscriptions. Features built for AHV, such as Flow and NC2 in the public cloud, need AHV. Check the compatibility matrix for the qualified ESXi versions."}],next:['Start on "Nutanix with external storage" and let the loop run: the array stays, compute nodes connect, and each VM disk becomes its own volume.','Switch arrays to show the protocol and dates change, then open "ESXi on Nutanix" and play "Stay on ESXi" and "Convert to AHV later".',"Then open Migration with Nutanix Move, Scale-out vs 3-tier or Disaster Recovery."]},Oy=[{content:Rg,Component:Dg,icon:"layers",parent:""},{content:vw,Component:ww,icon:"server",parent:"nci"},{content:Rw,Component:Dw,icon:"zap",parent:"nci"},{content:c1,Component:l1,icon:"shield",parent:"nci"},{content:_1,Component:N1,icon:"power",parent:"nci"},{content:U1,Component:G1,icon:"upgrade",parent:"nci"},{content:s0,Component:o0,icon:"net",parent:"nci"},{content:$0,Component:A0,icon:"lock",parent:"nci"},{content:H0,Component:W0,icon:"globe",parent:"nci"},{content:av,Component:sv,icon:"clone",parent:"nci"},{content:vv,Component:wv,icon:"shield",parent:"nci"},{content:Ov,Component:Vv,icon:"move",parent:"nci"},{content:Xv,Component:Wv,icon:"edge",parent:"nci"},{content:sx,Component:tx,icon:"plus",parent:"nci"},{content:mx,Component:fx,icon:"api",parent:""},{content:jx,Component:Ux,icon:"gauge",parent:""},{content:ik,Component:rk,icon:"k8s",parent:""},{content:vk,Component:wk,icon:"eye",parent:""},{content:Dk,Component:Ok,icon:"file",parent:""},{content:Uk,Component:Kk,icon:"k8s",parent:""},{content:nb,Component:tb,icon:"db",parent:""},{content:hb,Component:db,icon:"ai",parent:""},{content:vb,Component:wb,icon:"beacon",parent:""},{content:$b,Component:bb,icon:"cloud",parent:""},{content:Gb,Component:zb,icon:"layers",parent:""}];function Dy(e){return Oy.find(t=>t.content.path===e)}const qb=[{term:"AHV",full:"Nutanix AHV hypervisor",def:"Nutanix’s own hypervisor, built on Linux KVM. It runs the virtual machines on each node and is managed through Prism."},{term:"AOS",full:"Acropolis Operating System",def:"The Nutanix software that turns a group of servers into one cluster: storage, data protection, management services and APIs."},{term:"Autopathing / iSCSI redirector",def:"If the storage controller (CVM) on a host stops, that host’s VMs keep running and their storage I/O is redirected over the network to CVMs on other nodes. On ESXi and Hyper-V this is called autopathing; on AHV the iSCSI redirector does it."},{term:"Block",def:"A physical chassis that holds one to four nodes. Block awareness keeps copies of data in different blocks so a whole-chassis failure loses nothing."},{term:"Category",def:"A key/value tag (for example AppTier: Web) attached to VMs. Flow security policies and DR protection policies target categories instead of IP addresses or VM names."},{term:"Cluster",def:"A group of nodes managed as one system. Storage from every node is pooled and protected across the whole cluster."},{term:"Curator",def:"The AOS background service that scans metadata and runs cluster-wide jobs: re-protecting data after failures, disk balancing, tiering, erasure coding and cleanup."},{term:"CVM",full:"Controller VM",def:"A virtual machine on every node that runs the AOS services. Together the CVMs form the distributed storage controller, so storage performance and capacity grow with each node."},{term:"Data locality",def:"A VM’s data is kept on the node where the VM runs, so reads are served locally without crossing the network. After a VM moves, data it reads is gradually copied to its new node."},{term:"DSF",full:"Distributed Storage Fabric",def:"The storage layer of AOS. It pools the local drives in every node into one storage pool and keeps multiple copies (or parity) of every piece of data on different nodes."},{term:"EC-X",full:"Erasure coding",def:"Saves capacity on write-cold data by replacing full copies with parity spread across nodes. A 4/1 strip needs 1.25x the space instead of 2x for two full copies."},{term:"Extent / extent group",def:"The units AOS uses to store and track data. Placement and protection are managed per extent group, which is why recovery can target exactly the data that lost a copy."},{term:"Flow",def:"Nutanix software-defined networking and security: microsegmentation (Flow Network Security) and overlay virtual networks / VPCs (Flow Virtual Networking)."},{term:"HA",full:"High availability",def:"If a host fails, its VMs are restarted on the surviving hosts. With memory reservation enabled, enough capacity is held back to guarantee those restarts."},{term:"ILM",full:"Information lifecycle management",def:"Moves data between storage tiers based on how often it is used: hot data on the fastest media, cold data on capacity media."},{term:"LCM",full:"Life Cycle Manager",def:"The upgrade tool in Prism. It inventories software and firmware, picks a safe order, runs pre-checks and upgrades one node at a time while workloads keep running."},{term:"Metro Availability",def:"Synchronous replication between two sites close enough (low round-trip latency) that every write is committed at both before it is acknowledged, for zero data loss."},{term:"NC2",full:"Nutanix Cloud Clusters",def:"The same Nutanix stack (AOS and AHV) running on bare-metal instances in a public cloud, managed with the same tools as on-premises clusters."},{term:"NCI-C",full:"NCI Compute",def:"The Nutanix license for compute-only nodes that use an external storage array: AHV, Prism and DR automation, priced per core, with snapshots and clones left to the array."},{term:"NCM",full:"Nutanix Cloud Manager",def:"Operations, automation, cost governance and security compliance on top of the platform. Feature availability depends on license tier."},{term:"NDB",full:"Nutanix Database Service",def:"Database provisioning, patching, cloning and point-in-time recovery as a service, built on AOS snapshots and log capture."},{term:"NDK",full:"Nutanix Data Services for Kubernetes",def:"Snapshots, replication and disaster recovery for Kubernetes apps. It protects an app’s Kubernetes resources and its data together, as one unit."},{term:"NKP",full:"Nutanix Kubernetes Platform",def:"Nutanix’s platform for deploying and managing fleets of Kubernetes clusters across data center, edge and cloud."},{term:"Node",def:"One server: CPU, memory, drives and network, running a hypervisor plus a CVM."},{term:"NVMe/TCP",def:"A way to reach NVMe storage over ordinary Ethernet and TCP/IP, with no Fibre Channel network. Nutanix compute nodes use it to reach Everpure FlashArray and Dell PowerStore."},{term:"OpLog",def:"A fast write buffer on each CVM for bursty random writes. Writes land there, are copied to other nodes, are acknowledged, and are later drained to the extent store in large sequential chunks."},{term:"Prism Central",def:"The management console for many clusters. It runs as one VM or a small scale-out set of VMs and hosts multi-cluster features."},{term:"Prism Element",def:"The management interface built into every cluster. It manages that one cluster."},{term:"Rack awareness",def:"Keeps copies of data in different racks so losing a whole rack (power or top-of-rack switch) does not lose data."},{term:"RF",full:"Replication factor",def:"How many full copies of data the cluster keeps. RF2 keeps two copies on different nodes and survives one failure, with at least 3 nodes; RF3 keeps three and survives two, with at least 5."},{term:"RPO",full:"Recovery point objective",def:"The most data you can afford to lose, measured in time. An RPO of 1 hour means a recovery may lose up to the last hour of changes."},{term:"RTO",full:"Recovery time objective",def:"How long it may take to get an application running again after a disaster."},{term:"Stargate",def:"The AOS service that handles all storage I/O for its node: it receives VM reads and writes, manages caches and replicates writes to other CVMs."},{term:"vDisk",def:"A virtual disk as AOS sees it: any file over a small size that a VM or service reads and writes, such as a VM’s disk."},{term:"Witness",def:"A small VM at a third location that arbitrates when two sites (or a two-node cluster’s nodes) lose contact, so the right side keeps running automatically."},{term:"Zookeeper",def:"Stores the cluster’s configuration. It runs on 3 nodes (5 at redundancy factor 3) and needs a majority of them up to operate."}],Kb="data:image/svg+xml,%3c?xml%20version='1.0'%20encoding='utf-8'?%3e%3c!--%20Generator:%20Adobe%20Illustrator%2019.0.1,%20SVG%20Export%20Plug-In%20.%20SVG%20Version:%206.00%20Build%200)%20--%3e%3csvg%20version='1.1'%20id='Layer_1'%20xmlns='http://www.w3.org/2000/svg'%20xmlns:xlink='http://www.w3.org/1999/xlink'%20x='0px'%20y='0px'%20viewBox='0%200%20304%20182'%20style='enable-background:new%200%200%20304%20182;'%20xml:space='preserve'%3e%3cstyle%20type='text/css'%3e%20.st0{fill:%23252F3E;}%20.st1{fill-rule:evenodd;clip-rule:evenodd;fill:%23FF9900;}%20%3c/style%3e%3cg%3e%3cpath%20class='st0'%20d='M86.4,66.4c0,3.7,0.4,6.7,1.1,8.9c0.8,2.2,1.8,4.6,3.2,7.2c0.5,0.8,0.7,1.6,0.7,2.3c0,1-0.6,2-1.9,3l-6.3,4.2%20c-0.9,0
