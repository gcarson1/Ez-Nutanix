 a while, so the theoretical strip saving is rarely reached. Size on replication-factor capacity and treat EC-X as a bonus until you have measured how much of your data is cold."},{q:"Why reserve a whole node of free space?",a:"After a node failure, the cluster re-creates the missing copies on the remaining nodes. That needs free space equal to what the failed node held. Without it, data stays available but runs with fewer copies until you add capacity."},{q:"Do I need RF3?",a:"RF3 tolerates two simultaneous failures, at the cost of a third copy and more write work. It is common for large clusters and data where the risk window during a rebuild matters. Many clusters run RF2 with block awareness and a rebuild reserve. It is a risk decision, not a default."}],next:["RF2 with 8 nodes: let one loop play and point out that no node ever holds two copies of the same shape.","Watch the node fail: every shape still has a copy somewhere, then the healthy nodes re-create the missing copies together.","Switch to RF3: three copies of each shape, and two nodes can fail at once.","Change the node count and read the capacity bar: your data, the extra copies, and the space kept free for a rebuild.","Then open the Failure Gauntlet for other failures, or the Cluster & DSF Lab for EC-X, blocks and racks."],honest:["EC-X only applies to write-cold data and is applied in the background, so the full theoretical saving is rarely reached. Larger strips save more but make rebuilds more expensive.","A rebuild reserve is capacity you pay for and do not fill. Skipping it means a failure leaves data with fewer copies until capacity is added.","RF3 gives about two thirds of the usable capacity RF2 would give from the same drives, and adds write overhead. Block and rack awareness need enough blocks and racks to work.","This view models EC-X as post-process encoding of write-cold data, the default behavior. Inline erasure coding also exists (for example for Objects, and as an option in newer releases) and is not modeled here.","Compression and deduplication ratios vary widely by workload. This calculator uses 1.0:1 unless you enter a measured figure.","This calculator is for discussion. Use the official sizing tool for quotes; it accounts for per-version system overheads that are not modeled here."]},Sr=[{id:"disk",label:"Drive",blurb:"One drive dies. Its copies are rebuilt from the other copies, with every node helping."},{id:"cvm",label:"Controller VM",blurb:"One CVM stops for 15 minutes. The host and its VMs keep running; their I/O goes to other CVMs."},{id:"node",label:"Node",blurb:"A whole node powers off. HA restarts its VMs on other hosts and every other node helps re-protect its data."},{id:"block",label:"Block (chassis)",blurb:"A chassis holding two nodes loses power. Copies were kept in different blocks, so data stays available."},{id:"double",label:"Two nodes at once",blurb:"Two nodes fail together. RF2 keeps two copies, so some data loses both; RF3 keeps three."},{id:"full",label:"Nearly full cluster",blurb:"A node fails when drives are about 85% full. The survivors have no room to re-create every missing copy."}];function _f(e,t){return{...fr,nodes:8,nodesPerBlock:2,blockAware:!0,racks:1,rackAware:!1,rf:t,ft:t,ecx:!1,vms:24,fillPct:e==="full"?85:45,haReserve:!1}}function Pf(e,t,n){return t.some(s=>e>=s.t-20&&e<s.t+150)?12:Math.max(150,n/14)}function Vf(e,t,n,a,s){const r=n.filter(h=>h.k==="fail"&&h.t<=a+1e-9);if(!r.length)return{tone:"ink",k:"Healthy cluster",text:s};const i=r[r.length-1];if(!(i.f.kind==="disk"||e.events.some(h=>h.kind==="detect"&&h.t>=i.t)))return{tone:"bad",k:"Failure",text:`${Ua(i)}. The cluster is waiting for missed heartbeats to confirm it.`};if(t.resiliency==="Data unavailable"||t.resiliency==="Cluster down")return{tone:"bad",k:"Data unavailable",text:`${t.items.unavailable} sampled pieces of data lost every copy. They come back only when a failed node returns. This is what a third copy (RF3) protects against.`};const d=(e  Lab shows the 3-node case too."],numbers:[{k:"Failures tolerated",v:"RF2: 1 node or drive at a time · RF3: 2"},{k:"HA restart",v:"Starts about 60 s after a host fails; typically all restarted within about 120 s"},{k:"Re-protection",v:"Starts as soon as the failure is detected (not after a fixed wait)"},{k:"Metadata ring",v:"A node down for about 30 minutes is detached and its metadata share re-replicated"},{k:"HA reservation",v:"One host’s memory with RF2 containers · two hosts’ with RF3"},{k:"Block / rack awareness",v:"3 blocks or racks at RF2 · 5 at RF3 (4 and 6 with EC-X)"}],qa:[{q:"How long does a rebuild take?",a:"It depends on how much data the failed part held, how many nodes help, the hardware and how busy the cluster is. The estimate here is data divided by survivors times a per-node rate you can change, so treat it as a way to reason about scale, not a quote. Because every node helps, bigger clusters rebuild a failed node faster."},{q:"Is RF2 safe enough?",a:"RF2 survives any one node or drive failure and then rebuilds itself. The exposure is a second failure before that rebuild finishes. For most clusters, RF2 with enough free space and good monitoring is the common choice. RF3, and block or rack awareness, are there when that window matters more, at the cost of capacity and some write overhead."},{q:"Will my VMs go down if a node fails?",a:"The VMs on that node stop and are restarted by HA on other hosts, typically within a couple of minutes, so they see a reboot. VMs on other nodes keep running. By default restarts are best effort; turning on HA memory reservation holds back enough memory to guarantee them, which costs some usable memory."}],next:["Node with RF2: let it play and pause on the moment HA restarts the VMs, then on the rebuild.","Two nodes at once: RF2 loses access to some data; switch to RF3 and it survives.","Block (chassis): copies were kept in different blocks, so data stays available.","Nearly full cluster: the survivors have no room, n every node)"},{k:"Default bond type",v:"Active-Backup (recommended)"},{k:"Bandwidth with two 10 Gb/s links",v:"Active-Backup: 10 Gb/s per host · Balance-SLB: 20 per host, 10 per VM · LACP: 20 per host and per VM, 10 per connection"},{k:"LACP failure detection",v:"3 missed LACP messages, about 3 s at the fast rate Prism sets"},{k:"Host / CVM internal addresses",v:"192.168.5.1 / 192.168.5.254 on virbr0"},{k:"CVM MTU",v:"1500 (jumbo 9000 allowed on host NICs and guests end to end)"},{k:"Current release checked",v:"AHV 11.2, AOS 7.6"}],qa:[{q:"Do we have to reconfigure our switches?",a:"For Active-Backup, only trunk ports carrying the VLANs you use, with the management VLAN as native. Nothing else. LACP needs dynamic LACP and a LAG, MLAG or vPC on the switches, plus LACP fallback. Each new VLAN-backed network needs that VLAN on the trunks; overlay networks with Flow avoid that."},{q:"Why not use both links all the time?",a:"You can, with LACP: a single VM with several flows can then use both links, though each flow stays on one. It needs switch configuration and changing to it reboots the hosts one by one. MAC pinning (balance-slb) also uses both links without switch config, but Nutanix’s current guidance no longer recommends it because of multicast problems."},{q:"Can we separate storage and management traffic?",a:"Yes, with network segmentation. Backplane traffic between CVMs moves to its own interface (eth2) on a separate VLAN or a separate set of uplinks; RDMA, Volumes and DR traffic can be isolated too. It is not supported on two-node clusters."}],next:["Start on Active-backup with no failure: everything leaves on NIC A while NIC B waits as the backup.","Switch to Balance-SLB and point out that each VM keeps to one link, then to LACP to show one VM’s connections on both links and the LAG on the switches.","Choose “One link fails” with Active-backup, then with LACP: traffic moves to NIC B either way, and the bandwidth numbers show what is lost.","Then show Flow fo  routing, NAT and floating IPs. Traffic between hosts is wrapped in Geneve, so the physical network only needs host-to-host reachability.","For the network team, a new project on VPCs needs no new VLAN, trunk, gateway or unique IP range."],numbers:[{k:"Policy types",v:"Application, Isolation, Quarantine (Strict or Forensic), Shared Services, VDI"},{k:"Policy states",v:"Saved, Monitoring, Enforced"},{k:"Overlay encapsulation",v:"Geneve between AHV hosts (VTEP gateways use VXLAN)"},{k:"Geneve overhead",v:"58 bytes; guest MTU 1442 if the network cannot carry jumbo frames"},{k:"External networks",v:"NAT (source NAT + floating IPs) or routed (no NAT)"}],qa:[{q:"Do we need agents in the VMs?",a:"No. Flow Network Security is agentless: it runs in the AHV virtual switch. That also means it protects VMs on AHV; workloads elsewhere need their own controls."},{q:"Will turning on microsegmentation break our applications?",a:"It can if you enforce rules you have not validated. That is why policies start in Monitoring: traffic keeps flowing while the log shows what would be blocked. Fix the rules, then enforce."},{q:"Do overlay networks replace VLANs?",a:"Not necessarily. Both can run on the same cluster. VPCs suit self-service projects, overlapping ranges and multi-tenant setups; VLAN-backed subnets still fit workloads that must sit on an existing physical segment. VPCs need Prism Central with the Network Controller and an external VLAN for traffic in and out."}],next:["Network Security with Policy Off: app traffic flows and every unwanted try gets through. Switch to Monitor: the same tries are flagged in the log but still get through. Then Enforce: each one is stopped at the VM.","Turn on Quarantine Web-2: nothing gets in or out of Web-2, even with the policy Off, while Web-1 keeps the app running.","Virtual Networking, Inside a VPC: two VPCs use the very same addresses, and each packet crosses between hosts in an envelope tagged with its VPC.","Out to the internet, then In fro Xm={path:"nci/dr",title:"Disaster Recovery",tag:"Nutanix Cloud Infrastructure",summary:"Pick how much data you can afford to lose (the RPO), and the protection policy chooses the replication tier. Recovery plans then bring applications up at another site, in order, with one click.",priority:"P0",talk:["Protection is policy-based: you set a recovery point objective (RPO), assign VMs to the policy with categories, and the platform picks the replication tier.","Three tiers: asynchronous at 1 hour or more, NearSync at 1 to 15 minutes, and synchronous at RPO 0 for sites under 5 ms round trip.","The honest picture: between copies, recent writes exist only at the primary site. An unplanned failover loses whatever had not reached the other site yet.","Recovery plans are the runbook: boot order in stages, delays, network mapping and scripts. Test failover runs the same plan on clones in an isolated network, so you can prove it works without touching production.","For zero data loss with automatic failover, synchronous replication plus a Witness in a separate fault domain lets the surviving site take over on its own.","Sites can be combined: a nearby synchronous partner plus a distant NearSync or async copy, or a cloud site on Nutanix Cloud Clusters (NC2)."],numbers:[{k:"Asynchronous",v:"RPO 1 hour or more (up to 24 hours)"},{k:"NearSync",v:"RPO 1 to 15 minutes"},{k:"Synchronous",v:"RPO 0, needs under 5 ms round-trip time"},{k:"Automatic failover",v:"Synchronous + Witness in a separate fault domain"},{k:"NC2 clouds",v:"AWS, Microsoft Azure, Google Cloud, OVHcloud"}],qa:[{q:"Why not run everything synchronous and never lose data?",a:"Synchronous replication makes every write wait for the remote site, so it adds roughly one round trip of latency to each write and needs sites under 5 ms apart. Nearby sites can share a regional outage, so it is often paired with a farther asynchronous or NearSync copy."},{q:"Will we really meet a 15-minute RPO?",a:"Only if the link can ship each es go to new blocks and only the live disk’s map changes (redirect-on-write). The snapshot keeps pointing at the old blocks.","A clone is a new writable disk built from a snapshot’s map. It is ready at once and shares every block until it changes one.","Space grows only with change: the VM’s new writes, and each clone’s own changes. That is what makes many test and development copies affordable."],numbers:[{k:"Data copied to take a snapshot",v:"None (map only)"},{k:"New space for a fresh clone",v:"None until it is written"},{k:"Space a snapshot costs over time",v:"Old blocks the live disk has since replaced"}],qa:[{q:"Are snapshots a backup?",a:"Not on their own. A local snapshot lives on the same cluster as the data, so it does not protect against losing the cluster. Replicate snapshots to another site or cloud, or use a backup product, for that. Snapshots are excellent for fast local restore points and clones."},{q:"Do lots of snapshots slow the VM down?",a:"Taking a snapshot does not copy data, and writes after it go to new blocks without copying the old ones aside. The system still manages snapshot metadata in the background, so keep retention to what you need. Effects depend on workload and version."},{q:"How much space will my clones use?",a:"As much as they change. A clone that rewrites 10% of its disk uses about 10% of the disk’s size in new space, times the replication factor. A clone that rewrites everything ends up as large as a full copy."}],next:["Let one loop play and pause on the snapshot: the number of stored blocks does not change.","Pause after the new writes: only the changed blocks add space, and the snapshot still points at the old ones.","Pause on the clones: each shares every block until it writes its own.","Then open Database Service for database clones built on the same mechanism, or Disaster Recovery for copying snapshots to another site."],honest:["A snapshot keeps old blocks alive. The more the live disk changes, the more space the snapsh he DSF’s copies, self-healing and data efficiency.","Files: a set of file server VMs presents one namespace. Scale out with more FSVMs or up with bigger ones; clients keep the same path.","Kill an FSVM: a survivor takes over its volume group and IP address, folders stay reachable, and the original takes them back when it returns.","Volumes: hosts log in to one Data Services IP and are redirected to a healthy CVM, so path failover does not depend on client multipathing.","Objects: S3-compatible buckets on at least three worker VMs, with WORM and Object Lock for immutable backups and lifecycle tiering to other S3 targets."],numbers:[{k:"Files HA minimum",v:"3 FSVMs (1 FSVM = no HA)"},{k:"Files protocols",v:"SMB 2/3, NFS v3/v4"},{k:"Objects minimum",v:"3 worker VMs"},{k:"Objects API",v:"S3 (v4 signatures)"},{k:"Licensing",v:"NUS per usable TiB: Starter, Pro"}],qa:[{q:"Do we need separate hardware for file and object storage?",a:"No. NUS can run on the same clusters as your VMs (NCI mode) or on dedicated clusters (dedicated mode). Large file or backup estates often get dedicated clusters so they can be sized independently."},{q:"What happens to users when a file server VM fails?",a:"Another FSVM takes over the failed FSVM’s volume group and IP address. SMB clients may see a brief pause or reconnect; the path does not change. With a single-FSVM file server there is no takeover."},{q:"Can Objects be our immutable backup target?",a:"Yes, that is a common use: WORM buckets and S3 Object Lock prevent changes or deletion until retention expires. Check that your backup software supports Object Lock and test restore times."}],next:["Data Lens","Cluster & DSF Lab","Database Service"],honest:["File servers and object stores are VMs on the cluster: they consume CPU and memory that must be in the sizing.","NUS Starter is aimed at hybrid, archive and backup use and does not include Volumes; NUS Pro does.","FSVM failover is fast but not invisible: SMB sessions may pause or reconnect  1.0",v:"Through NDK, RPO 1 hour or more"}],qa:[{q:"Can we run it on AKS or GKE?",a:"Not confirmed. Release 1.0 supports Amazon EKS. Azure and Google Cloud were mentioned as intentions in 2025 press coverage, but Nutanix has not confirmed support, so do not plan on them yet."},{q:"Can we run it on our own bare-metal servers today?",a:"Not as a generally available product. Bare metal comes through NKP Metal, announced as early access in April 2026 with GA targeted for the second half of 2026. NKP Pro and Ultimate can already run Kubernetes on pre-provisioned bare metal, with storage through a CSI driver."},{q:"Is this the same as Project Beacon?",a:"Related. Project Beacon was the 2023 vision of data services that run anywhere. Cloud Native AOS, together with NDK, is the first concrete product from that direction."}],next:['Start on "On a hypervisor" and let the stack build, then switch to Amazon EKS and point at the one layer that stays the same.',"Switch to Bare metal to show where NKP Metal fits, and say it is early access.","Then open Kubernetes Platform, Project Beacon or Disaster Recovery."],honest:["Release 1.0 is narrower than VM-based AOS: EKS only, up to 15 workers, RF2, and DR with an RPO of an hour or more.","Moving AOS into Kubernetes means storage operations follow Kubernetes practices, which suits platform teams more than VM administrators.","Bare-metal support is early access with a target date, not a shipping product; check the current status before committing a project to it."]};function lu(e,t){const n=[];for(let a=e.snapOffsetMin;a<=Math.min(t,e.windowMin);a+=e.snapEveryMin)n.push(a);return n}function nv(e,t){const n=[];for(let a=e.logEveryMin;a<=Math.min(t,e.windowMin);a+=e.logEveryMin)n.push(a);return n}function cu(e,t){const n=nv(e,t);return n.length?n[n.length-1]:0}function ov(e,t,n){const a=lu(e,t),s=cu(e,t),r=a.length?a[0]:null;if(r===null||n<r)return{ok:!1,target:n,effective:r??0,snapshot:r,logMin:0,lastCaptured:s,reason:"Before the first s ntrol.","Pick where it runs: your data center (NKP on Nutanix), public cloud (EKS, AKS or GKE in your own account), or an air-gapped site. Air-gapped means NKP in your own data center: Hugging Face is out, and the model comes as air-gapped NIM or your own files.","Every replica loads its own copy of the model onto its GPUs. Apps and agents call one endpoint address with an API token; role-based access control decides who can create endpoints and tokens, and GPU and model monitoring are built in.","The endpoint spreads requests over the replicas. With one replica, requests queue in busy moments, and a stop for an update or a fault means a pause. With two or more, the others keep answering.","NAI 2.8 adds the Agent Gateway in front of endpoints: token tracking and quotas per app, and an MCP Gateway for governed tool access by agents. It can also split a large model across several GPUs in one replica.","Naming: NAI is the product, now at 2.8. Nutanix Agentic AI is the wider full-stack solution around it, and GPT-in-a-Box is the earlier name for the bundle NAI was part of."],numbers:[{k:"Current release",v:"NAI 2.8 (GA August 2026)"},{k:"Runs on",v:"NKP, plus EKS, AKS and GKE"},{k:"Model sources",v:"NVIDIA NIM, Hugging Face, your own"},{k:"Pricing basis",v:"Infrastructure resources, not tokens"},{k:"Also in NAI 2.8",v:"Agent Gateway with MCP Gateway, multi-GPU serving, batch inference, speculative decoding, LoRA fine-tuning (models under 8B), custom IAM roles, air-gapped NIM"}],qa:[{q:"Does our data leave our site?",a:"Not when the endpoint runs on NKP in your data center: prompts, responses and model files stay on your infrastructure, and it can run fully air-gapped. In public cloud it runs in your own account and region."},{q:"Which models can we run?",a:"NVIDIA NIM packages, models from Hugging Face, or model files you upload. Fit depends on GPU memory; NAI 2.8 can split a model across several GPUs."},{q:"Is Nutanix Agentic AI a separate product we buy?",a:"It is a full-stack solution rather than one product: NAI plus NKP, AHV, Flow and Nutanix Unified Storage, integrated with NVIDIA AI Enterprise. Some parts are GA and some were early access, with the full solution targeted for the second half of 2026."}],next:["Start on your data center with 2 replicas: requests spread over both, then one stops and the other keeps answering.","Switch to 1 replica to show the queue, and the pause when the only replica stops.","Switch to the air-gapped site: the model comes in as files, with no internet connection.","Then open the Kubernetes Platform module for what the endpoint runs on."],honest:["GPUs are the real constraint: model size and traffic decide how many you need, and that sizing is a separate exercise from this picture.","Some agentic AI pieces were early access in 2026; confirm what is GA for the features a project depends on.","Running your own endpoints means your team operates them: capacity, model updates and access policies are yours to manage."]},ro=[{year:"2023",title:"The idea",tone:"ink",text:"At .NEXT in May 2023, Nutanix described Project Beacon as a multi-year vision: build an app once, run it anywhere, and let its data services come along. Databases as a service were named first; NDB ships today, though the run-anywhere service in the vision is broader.",piece:{name:"Database Service (NDB)",short:"NDB",status:"Shipping",tone:"ok",sub:"Databases as a service, the first step named in 2023"}},{year:"2024",title:"Kubernetes storage",tone:"ink",text:"In May 2024 the vision widened to cloud-native block and file storage for Kubernetes apps. NDK, which gives those apps snapshots, replication and DR, had gone GA that March.",piece:{name:"Data Services for Kubernetes (NDK)",short:"NDK",status:"Shipping",tone:"ok",sub:"Snapshots, replication and DR for Kubernetes apps · GA March 2024"}},{year:"2025",title:"First real product",tone:"ok",text:"Cloud Native AOS was announced in May 2025: AOS running as pods inside Kubernetes, with . Its first concrete outcome is Cloud Native AOS with NDK.",priority:"P2",talk:["Say it plainly up front: Project Beacon is a vision Nutanix announced in 2023, not something you can buy.","The idea: developers build an app once and run it anywhere, and the data services (storage, databases, protection) come along with it.","Let the timeline run through the years. 2023: the idea, with databases as a managed service first. 2024: broadened to cloud-native storage for Kubernetes. 2025: Cloud Native AOS, the first concrete product. 2026: bare metal through NKP Metal, in early access.","Read the cards as they appear: the green ones ship today, the amber one is early access, and the band across the top is still only a direction.","Use it to explain why Cloud Native AOS, NDK and NKP fit together, not as a roadmap promise."],numbers:[{k:"Announced",v:"May 2023 (.NEXT Chicago)"},{k:"Expanded",v:"May 2024: cloud-native block and file storage"},{k:"NDK",v:"GA March 2024; NDK 2.3 in August 2026"},{k:"First product",v:"Cloud Native AOS, May 2025 (1.0 on EKS, July 2025)"},{k:"NKP Metal",v:"Early access April 2026; GA targeted 2H 2026"}],qa:[{q:"Can we buy Project Beacon?",a:"No. It is a vision, not a product or license. What you can buy are the products that came from it, such as Cloud Native AOS, NDK, NKP and NDB."},{q:"How does it relate to Cloud Native AOS?",a:'Cloud Native AOS, together with NDK, is the first concrete product of the Beacon direction. Some press even described Cloud Native AOS as "previously known as Project Beacon", but Nutanix presented Beacon as the broader vision.'},{q:"Is there a roadmap date for the full vision?",a:"No. It was described as multi-year, and Nutanix no longer markets it as a product. Judge it by the pieces that ship and their own dates."}],next:["Let the timeline run once while you say up front that Beacon is a direction, not a product.","Stop on 2025 to point at Cloud Native AOS as the first concrete product, then open the Cloud Native AOS  GA on Amazon EKS only."],numbers:[{k:"NC2 clouds (GA)",v:"AWS, Azure, Google Cloud, OVHcloud"},{k:"NC2 on Google Cloud",v:"GA Dec 9, 2025 · Z3 and C4 bare metal · 17 regions"},{k:"GC2 on AWS GovCloud (US)",v:"Available"},{k:"AWS European Sovereign Cloud",v:"Announced, “later in 2026”"},{k:"Cloud Native AOS",v:"GA on Amazon EKS (1.0, Jul 2025)"},{k:"Also supported on NC2",v:"Nutanix Move and Database Service (NDB) on AWS, Azure and Google Cloud"}],qa:[{q:"Is NC2 on Google Cloud real, or still a preview?",a:"It became generally available on December 9, 2025, on Z3 and C4 bare-metal instances in 17 regions. One card on the NC2 product page still says preview; the GA announcement and the NC2 FAQ are the current statements."},{q:"Do we have to change our applications to run them on NC2?",a:"No. VMs run on the same AHV hypervisor, so they move as they are; with the right network design they can keep their IP and MAC addresses. Modernizing to native cloud services can come later, app by app."},{q:"Can we use Cloud Native AOS on AKS or GKE?",a:"Not confirmed today. Cloud Native AOS 1.0 is generally available on Amazon EKS. Bare-metal support is tied to NKP Metal, which was in early access with a 2H 2026 target. Check current status before planning."}],next:["Start with disaster recovery on AWS: replication, the site going down, and the VMs powering on in the cloud.","Switch to burst capacity to show cloud nodes added for a peak and released afterwards.","Switch to data-center exit to show workloads moving in waves and the building being retired.","Change the cloud to Azure or Google Cloud: the picture stays the same, which is the point.","Then Disaster Recovery for the policies, Migration with Nutanix Move for the move itself, or Cloud Native AOS for containers."],honest:["Bare-metal cloud instances are billed while they run, whether or not they are busy; size a DR cluster for steady state and plan how it grows on failover.","Instance types, regions and features differ between clouds and change often; confirm for your target region.","Network design (connectivity to on-premises, IP ranges, egress costs) is usually the long pole of an NC2 project."]},gu=[{content:lp,Component:ip,icon:"layers",parent:""},{content:tf,Component:ef,icon:"server",parent:"nci"},{content:vf,Component:wf,icon:"zap",parent:"nci"},{content:Nf,Component:Cf,icon:"shield",parent:"nci"},{content:Of,Component:Tf,icon:"power",parent:"nci"},{content:Zf,Component:Xf,icon:"upgrade",parent:"nci"},{content:cm,Component:lm,icon:"net",parent:"nci"},{content:Tm,Component:Vm,icon:"lock",parent:"nci"},{content:Xm,Component:jm,icon:"globe",parent:"nci"},{content:hy,Component:dy,icon:"clone",parent:"nci"},{content:Ay,Component:Sy,icon:"shield",parent:"nci"},{content:Hy,Component:Iy,icon:"move",parent:"nci"},{content:tg,Component:Xy,icon:"edge",parent:"nci"},{content:dg,Component:ig,icon:"plus",parent:"nci"},{content:bg,Component:kg,icon:"api",parent:""},{content:Zg,Component:Qg,icon:"gauge",parent:""},{content:uw,Component:hw,icon:"k8s",parent:""},{content:Aw,Component:Sw,icon:"eye",parent:""},{content:Gw,Component:zw,icon:"file",parent:""},{content:tv,Component:ev,icon:"k8s",parent:""},{content:dv,Component:cv,icon:"db",parent:""},{content:vv,Component:wv,icon:"ai",parent:""},{content:$v,Component:Av,icon:"beacon",parent:""},{content:Ov,Component:_v,icon:"cloud",parent:""}];function wu(e){return gu.find(t=>t.content.path===e)}const Rv=[{term:"AHV",full:"Nutanix AHV hypervisor",def:"Nutanix’s own hypervisor, built on Linux KVM. It runs the virtual machines on each node and is managed through Prism."},{term:"AOS",full:"Acropolis Operating System",def:"The Nutanix software that turns a group of servers into one cluster: storage, data protection, management services and APIs."},{term:"Autopathing / iSCSI redirector",def:"If the storage controller (CVM) on a host stops, that host’s VMs keep running and their storage I/O is redirected over the network to CVMs on other nodes. On ESXi and Hyper-V this is called autopathing; on AHV the iSCSI redirector does it."},{term:"Block",def:"A physical chassis that holds one to four nodes. Block awareness keeps copies of data in different blocks so a whole-chassis failure loses nothing."},{term:"Category",def:"A key/value tag (for example AppTier: Web) attached to VMs. Flow security policies and DR protection policies target categories instead of IP addresses or VM names."},{term:"Cluster",def:"A group of nodes managed as one system. Storage from every node is pooled and protected across the whole cluster."},{term:"Curator",def:"The AOS background service that scans metadata and runs cluster-wide jobs: re-protecting data after failures, disk balancing, tiering, erasure coding and cleanup."},{term:"CVM",full:"Controller VM",def:"A virtual machine on every node that runs the AOS services. Together the CVMs form the distributed storage controller, so storage performance and capacity grow with each node."},{term:"Data locality",def:"A VM’s data is kept on the node where the VM runs, so reads are served locally without crossing the network. After a VM moves, data it reads is gradually copied to its new node."},{term:"DSF",full:"Distributed Storage Fabric",def:"The storage layer of AOS. It pools the local drives in every node into one storage pool and keeps multiple copies (or parity) of every piece of data on different nodes."},{term:"EC-X",full:"Erasure coding",def:"Saves capacity on write-cold data by replacing full copies with parity spread across nodes. A 4/1 strip needs 1.25x the space instead of 2x for two full copies."},{term:"Extent / extent group",def:"The units AOS uses to store and track data. Placement and protection are managed per extent group, which is why recovery can target exactly the data that lost a copy."},{term:"Flow",def:"Nutanix software-defined networking and security: microsegmentation (Flow Network Security) and overlay virtual networks / VPCs (Flow Virtual Networking)."},{term:"HA",full:"High availability",def:"If a host fails, its VMs are restarted on the surviving hosts. With memory reservation enabled, enough capacity is held back to guarantee those restarts."},{term:"ILM",full:"Information lifecycle management",def:"Moves data between storage tiers based on how often it is used: hot data on the fastest media, cold data on capacity media."},{term:"LCM",full:"Life Cycle Manager",def:"The upgrade tool in Prism. It inventories software and firmware, picks a safe order, runs pre-checks and upgrades one node at a time while workloads keep running."},{term:"Metro Availability",def:"Synchronous replication between two sites close enough (low round-trip latency) that every write is committed at both before it is acknowledged, for zero data loss."},{term:"NC2",full:"Nutanix Cloud Clusters",def:"The same Nutanix stack (AOS and AHV) running on bare-metal instances in a public cloud, managed with the same tools as on-premises clusters."},{term:"NCM",full:"Nutanix Cloud Manager",def:"Operations, automation, cost governance and security compliance on top of the platform. Feature availability depends on license tier."},{term:"NDB",full:"Nutanix Database Service",def:"Database provisioning, patching, cloning and point-in-time recovery as a service, built on AOS snapshots and log capture."},{term:"NKP",full:"Nutanix Kubernetes Platform",def:"Nutanix’s platform for deploying and managing fleets of Kubernetes clusters across data center, edge and cloud."},{term:"Node",def:"One server: CPU, memory, drives and network, running a hypervisor plus a CVM."},{term:"OpLog",def:"A fast write buffer on each CVM for bursty random writes. Writes land there, are copied to other nodes, are acknowledged, and are later drained to the extent store in large sequential chunks."},{term:"Prism Central",def:"The management console for many clusters. It runs as one VM or a small scale-out set of VMs and hosts multi-cluster features."},{term:"Prism Element",def:"The management interface built into every cluster. It manages that one cluster."},{term:"Rack awareness",def:"Keeps copies of data in different racks so losing a whole rack (power or top-of-rack switch) does not lose data."},{term:"RF",full:"Replication factor",def:"How many full copies of data the cluster keeps. RF2 keeps two copies on different nodes and survives one failure; RF3 keeps three and survives two."},{term:"RPO",full:"Recovery point objective",def:"The most data you can afford to lose, measured in time. An RPO of 1 hour means a recovery may lose up to the last hour of changes."},{term:"RTO",full:"Recovery time objective",def:"How long it may take to get an application running again after a disaster."},{term:"Stargate",def:"The AOS service that handles all storage I/O for its node: it receives VM reads and writes, manages caches and replicates writes to other CVMs."},{term:"vDisk",def:"A virtual disk as AOS sees it: any file over a small size that a VM or service reads and writes, such as a VM’s disk."},{term:"Witness",def:"A small VM at a third location that arbitrates when two sites (or a two-node cluster’s nodes) lose contact, so the right side keeps running automatically."},{term:"Zookeeper",def:"Stores the cluster’s configuration. It runs on 3 nodes (5 at redundancy factor 3) and needs a majority of them up to operate."}],Ev=[{id:"fed",title:"Prism Federation",sub:"API | Alerts | LCM | IAM",path:"central",params:{tab:"fed"}},{id:"ncm",title:"Cloud Manager",sub:"AIOps | Self-Service | Cost | SecOps",path:"ncm"},{id:"nkp",title:"Kubernetes Platform",sub:"LCM | Fleet Management | Security",path:"nkp"},{id:"lens",title:"Data Lens",sub:"Security | Privacy",path:"datalens"}],Bv=[{id:"files",title:"Files, Objects",path:"storage"},{id:"cnaos",title:"Cloud Native AOS",path:"cnaos"},{id:"ndb",title:"Database Service",path:"ndb"},{id:"ai",title:"Enterprise AI",path:"ai"}],Dv=[{id:"aws",title:"AWS",path:"cloud",params:{c:"aws"}},{id:"azure",title:"Azure",path:"cloud",params:{c:"azur
