s in an isolated network, so you can prove it works without touching production.","Metro Availability is zero data loss with automatic failover: synchronous replication between sites under 5 ms round trip, plus a Witness in a third location that gives the surviving site the lock so its VMs restart on their own.","Sites can be combined: a nearby synchronous partner plus a distant NearSync or async copy, or a cloud site on Nutanix Cloud Clusters (NC2)."],numbers:[{k:"Asynchronous",v:"RPO target of 1 hour or more (up to 24 hours)"},{k:"NearSync",v:"RPO target of 1 to 15 minutes"},{k:"Synchronous",v:"RPO 0, needs under 5 ms round-trip time; failover is started by a person"},{k:"Metro Availability",v:"Synchronous + a Witness in a third location: automatic failover restarts the VMs at the surviving site (minutes); a planned move can live-migrate them instead"},{k:"NC2 clouds",v:"AWS, Microsoft Azure, Google Cloud, OVHcloud"}],qa:[{q:"Why not run everything synchronous and never lose data?",a:"Synchronous replication makes every write wait for the remote site, so it adds roughly one round trip of latency to each write and needs sites under 5 ms apart. Nearby sites can share a regional outage, so it is often paired with a farther asynchronous or NearSync copy."},{q:"Will we really meet a 15-minute RPO?",a:"Only if the link can ship each recovery point before the next one is due. RPO depends on change rate and bandwidth; if the link falls behind, exposure grows past the target. Size bandwidth for peak change rate, and watch for policy alerts."},{q:"What if only the link between the sites breaks?",a:"With Metro Availability the Witness settles it: the site that gets its lock keeps running the VMs, and replication pauses instead of failing over, so the VMs never run in both places. On AHV an administrator resumes replication once the link is back. If a site loses both the other site and the Witness, it stops its VMs so the other site can take over safely."}],next:["Start on “A , Cost Governance (formerly Beam) and Security Compliance (formerly Security Central). From NCM 2.0 they run inside Nutanix Central on-premises instead of Prism Central, and NCM 2.1 added a smaller 3-node form factor.","AIOps learns each VM’s normal range from its history instead of using a fixed threshold. In this picture a 3 a.m. spike is flagged though it stays under a 70% alarm; a busy-afternoon spike trips both.","Intelligent Operations also forecasts capacity runway, so purchases are planned rather than reactive, and suggests right-sizing for over- and under-sized VMs.","Self-Service: app teams order from a catalog and get VMs or whole apps with no ticket. The quota is checked before anything is created; an approval policy is optional and holds only requests over its limit. Over quota, the request is sent back with the reason, and a smaller size can fit.","Cost: dev-test runs hot. Cost Governance meters it daily at your rates, alerts the owner in time to act, and lists idle and oversized VMs. Self-Service quota, approval and scheduler policies stop it coming back.","Security Compliance scans settings against a baseline, suggests a fix per finding and catches drift. Tiers: Starter covers forecasting and right-sizing, Pro adds Cost Governance and Self-Service, Ultimate adds Security Compliance, multi-VM blueprints and approvals."],numbers:[{k:"NCM components",v:"Intelligent Operations · Self-Service · Cost Governance · Security Compliance"},{k:"Self-Service & Cost Governance",v:"From NCM Pro"},{k:"Security Compliance, multi-VM blueprints, approvals",v:"NCM Ultimate"},{k:"Current release",v:"NCM 2.1 (Aug 2026)"},{k:"NCM 2.x",v:"2.0 GA Apr 2026 · requires Nutanix Central on-premises"},{k:"Small form factor (NCM 2.1)",v:"3 nodes, about 2,500 VMs"},{k:"Medium form factor (NCM 2.0)",v:"About 10,000 VMs"}],qa:[{q:"Does cost data go to a Nutanix cloud service?",a:"Not in NCM 2.x. From NCM 2.0, Cost Governance runs fully on-premises inside your data center, without a separate SaaS application. Older Beam deployments were SaaS, so check which version you are comparing."},{q:"Does a budget stop the spending by itself?",a:"Not as far as the published material says. Cost Governance budgets track spend and send overspend alerts, and its recommendations show what to stop or right-size; we found no budget setting that switches resources off. The hard limit is the Self-Service project quota, which caps the CPU, memory and storage a project can deploy, with approval and scheduler policies on NCM Ultimate."},{q:"Can it manage our VMware estate too?",a:"NCM 2.x spans multiple Prism Centrals and VMware vCenters, and Intelligent Operations Starter lists ESXi on non-Nutanix infrastructure. Feature coverage differs between AHV and vCenter-managed environments, so map your use cases to the current feature matrix."}],next:["On the AIOps tab, pause on the 3 a.m. spike, flagged by the learned band while the fixed 70% alarm stays silent, then on the 2 p.m. spike, which both catch.","On the Self-Service tab, let the four requests play: the Linux VM skips the optional approval, the 3-tier app waits for an admin, the second app is sent back over the quota, and the same app at size S fits.","On the Cost tab, pause on each numbered step (the alert, the recommendations, the quota and policies) and compare where the month ends with the Left alone line.","On the Security tab, watch findings get fixed, then a setting changed by hand caught by the next scan.","Then open Nutanix Central & Prism Federation to see where NCM 2.x runs."],then:["central"]},Oe=[0,8,16,24,33,42],BA=50,Xp=[{tone:"ink",k:"Islands",label:"Kubernetes is powerful, but operating every cluster consistently is hard.",text:"Four places run Kubernetes: Nutanix, VMware, AWS and Azure. Each cluster comes with its own upgrade scripts, monitoring, security and ticket queue, managed its own way."},{tone:"warn",k:"Hidden work",label:"Every cluster becomes its own project.",text:"Behind every island the same work repeats: provisioning, upgrades, security policies, observability, storage and data protection, developer access and troubleshooting. Four environments, seven jobs each, 28 separate processes."},{tone:"flow",k:"NKP arrives",label:"NKP adds one consistent operating model across Kubernetes environments.",text:"NKP sits above the environments without replacing them and connects to each. It is open, upstream Kubernetes built from CNCF projects with open-source APIs, so apps and automation stay portable. EKS and AKS each tie you to one cloud, and OpenShift to RHEL and the Red Hat stack; NKP runs across all of these environments, with no lock-in to NKP."},{tone:"flow",k:"One fleet",label:"One view. Consistent policy. Controlled change.",text:"The clusters now share one status language. A policy goes to all four; an upgrade goes to the three NKP clusters, while the attached AKS cluster keeps following Azure’s own upgrades."},{tone:"ok",k:"Two teams, one road",label:"Platform teams govern the road. Developers use the road.",text:"The platform team sees fleet health, compliance and upgrades in one place. A developer asks for a namespace, and it lands on an approved cluster with storage, networking, observability and policy already attached."},{tone:"ok",k:"The outcome",label:"Consistent cloud-native operations wherever the apps run.",text:"Apps run across private cloud, VMware and public cloud, on the same Kubernetes, storage, data protection, observability and automation, operated one way."}],HA=ae(Oe,Xp.map(e=>[e.k,e.text])),ub=Oe[2]+2.2,Qi=960,GA=424,To=225,pb=20,Mc=e=>e*(To+pb),Ve={y:262,h:156},De={y:104,h:128},er=[{name:"Nutanix (AHV)",sub:"private cloud",nkp:!0,tools:["upgrade script v3","Prometheus","infra ticket queue"]},{name:"VMware vSphere",sub:"on-premises",nkp:!0,tools:["runbook upgrades","vendor monitor","email alerts"]},{name:"AWS",sub:"NKP cluster in your account",nkp:!0,tools:["console upgrades","CloudWatch","cloud support cases"]},{name:"Azure"  Kubernetes upgrade itself is shown on LCM Rolling Upgrade’s Kubernetes (NKP) tab."})})]})}const XA={path:"nkp",title:"Kubernetes Platform",tag:"Nutanix Central",summary:"Nutanix Kubernetes Platform (NKP) turns Kubernetes clusters that are each run their own way into one operating model, wherever they run: lifecycle, security, observability, GitOps, data protection and fleet management from one place.",priority:"P2",talk:["Kubernetes is the orchestration layer; NKP is the operating platform around it. It grew out of the D2iQ Kubernetes Platform, which Nutanix acquired in late 2023.","Start with the islands: on Nutanix, VMware and each public cloud, every cluster tends to get its own upgrade process, monitoring, security and ticket queue. The same work repeats everywhere, so every cluster becomes its own project.","Open Kubernetes, no lock-in: NKP is not a fork and adds no wrapper API. It is built from upstream CNCF projects that Nutanix integrates and validates as one production stack, so apps and automation written for it work on any CNCF-compliant Kubernetes distribution. Contrast that with EKS and AKS, each tied to one cloud, and OpenShift, tied to RHEL and the Red Hat ecosystem.","One fleet: clusters on Nutanix, vSphere, bare metal and public cloud share one view and one policy, and existing EKS and AKS clusters can be attached. Attached clusters still take their Kubernetes upgrades from their cloud.","Platform teams govern the road, developers use the road: the platform team sees fleet health, compliance and upgrades; developers get namespaces on approved clusters with storage, networking, observability and policy attached.","On Nutanix it connects to the rest of the platform: AHV, Unified Storage, Data Services for Kubernetes and Database Service. The Kubernetes upgrade rollout itself is on LCM Rolling Upgrade, under its Kubernetes (NKP) tab."],numbers:[{k:"Current release",v:"NKP 2.19 (Oct 2026) · Kubernetes 1.36 by default, 1.35 supported"},{k:"Editions",v:" Storage: Files, Volumes, Objects",tag:"Platform services",summary:"Nutanix Unified Storage (NUS) is fast, exabyte-scale unstructured storage: Files (SMB, NFS and parallel NFS for HPC), Volumes (iSCSI) and Objects (S3) from the Distributed Storage Fabric (DSF) that runs your VMs, so one platform is protected, sized and upgraded the same way.",priority:"P1",talk:["One fabric, three access methods: Files for shares, Volumes for block, Objects for S3. All three inherit the DSF’s copies, self-healing and data efficiency.","Position it as fast, exabyte-scale storage for unstructured data. Files: a set of file server VMs (FSVMs) presents one namespace. Scale out with more FSVMs or up with bigger ones; clients keep the same path. For HPC, parallel NFS (pNFS) lets clients read and write across many FSVMs at once.","Fail an FSVM: a survivor takes over its volume group and IP address, folders stay reachable and the original takes them back when it returns.","Volumes: hosts log in to one Data Services IP and are redirected to a healthy Controller VM (CVM), so path failover does not depend on client multipathing.","Objects: S3-compatible buckets on at least three worker VMs, with WORM and Object Lock for immutable backups. Lifecycle rules tier old objects to any S3-compatible store, on-premises or in a public cloud."],numbers:[{k:"Current release",v:"NUS 5.4 (Jul 2026), with Files 5.4 and Objects 5.4"},{k:"Files HA minimum",v:"3 FSVMs; a single FSVM has no HA"},{k:"Files protocols",v:"SMB 2/3, NFS v3/v4, parallel NFS (pNFS) for HPC; encrypted NFS in 5.4"},{k:"Scale",v:"Exabyte-scale unstructured data"},{k:"Objects minimum",v:"3 worker VMs; since 5.4 no load balancer VMs on supported AHV setups"},{k:"Objects API",v:"S3 (v4 signatures)"},{k:"Licensing",v:"NUS per usable TiB: Starter (hybrid, backup and archive) or Pro"},{k:"Volumes for outside hosts",v:"Not with NCI Starter, which serves in-cluster VMs only"}],qa:[{q:"Do we need separate hardware for file and object storage?",a:"N o not want to send sensitive prompts to a shared public service. NAI lets them run models on infrastructure they control.","Pick where it runs: your data center (NKP on Nutanix), public cloud (EKS, AKS or GKE in your own account) or an air-gapped site, which means NKP in your data center with no internet and no Hugging Face.","Each replica loads its own copy of the model onto its GPUs. Apps and agents call one endpoint address with an API token; role-based access control decides who creates endpoints and tokens, with GPU and model monitoring built in. A supported model can span several GPUs; spanning GPU nodes is a tech preview. Not every model needs a full GPU: from NAI 2.5 a replica can run on an NVIDIA MIG slice (or a vGPU), which suits embedding models and small language models.","The endpoint spreads requests over the replicas. With one replica, requests queue in busy moments, and a stop for an update or a fault means a pause. With two or more, the others keep answering.","Agent Gateway, licensed separately, gives apps one address for every model: your NAI endpoints, a remote NAI cluster or an external provider, with fallback and per-client rate limits (by request header in tech preview), and semantic routing by policy planned for NAI 2.10. Its Model Context Protocol (MCP) Gateway adds API keys, limits tool actions and logs every call.","GPUs tab: GPUs are the scarce part, so show how NAI fits models onto them. Small models share one GPU as MIG slices and the spare slice goes to another workload; a model too big for one GPU spans several with tensor parallelism; a tech preview spans nodes; and hibernating an idle endpoint frees its GPUs while keeping its configuration.","Faster answers tab: speculative decoding lets a small draft model guess tokens that the large model checks in one pass, up to 2.5x faster by Nutanix’s figure. KV-cache offload, a tech preview, keeps a conversation’s notes in host memory so its next answer starts fast.","Models and data tab: fine-tune a model under 8B parameters on your own data with LoRA, share selected models with chosen teams under custom roles, and ground the Agent app’s answers in your documents with citations.","Naming: NAI is the product, now at 2.8. Nutanix Agentic AI is the wider full-stack solution around it, and GPT-in-a-Box is the earlier name for the bundle NAI was part of."],numbers:[{k:"Current release",v:"NAI 2.8 (Aug 2026)"},{k:"Runs on",v:"NKP or other CNCF Kubernetes; tested on EKS, AKS and GKE"},{k:"Model sources",v:"NVIDIA Inference Microservices (NIM), Hugging Face, your own files; a catalog of pre-validated models. Air-gapped sites use air-gapped NIM or your own files"},{k:"Licensing",v:"By GPU memory (vCPUs on clusters without GPUs), not tokens"},{k:"Agent Gateway",v:"Licensed separately · one unified endpoint for NAI endpoints, remote NAI clusters and external provider APIs · fallback · token rate limits, global or per client by API key (by request header in tech preview) · MCP Gateway (GA in 2.8) with API keys added at the gateway, tool permissions and audit logs"},{k:"GPUs per replica",v:"Whole GPUs, or an NVIDIA MIG slice (from NAI 2.5) or vGPU for models that do not need a full GPU"},{k:"Semantic routing",v:"Planned for NAI 2.10: Agent Gateway routes each request to a model by policy"},{k:"Also in NAI 2.8",v:"Multi-GPU serving by tensor parallelism (multi-node in tech preview), batch inference, speculative decoding, KV-cache offload (tech preview), endpoint hibernation (from 2.3), LoRA fine-tuning (GA for models under 8B), custom IAM roles and model sharing, document-grounded answers with citations, air-gapped NIM"}],qa:[{q:"Does our data leave our site?",a:"Not when the endpoint runs on NKP in your data center: prompts, responses and model files stay on your infrastructure, and it can run fully air-gapped. In public cloud it runs in your own account and region."},{q:"Which models can we run?",a:"NVIDIA NIM packages (with an NVIDIA AI Enterprise license), models from Hugging Face or model files you upload. NAI keeps a catalog of pre-validated models; others you import yourself. Fit depends on GPU memory; NAI 2.8 can split supported models across several GPUs."},{q:"Is Nutanix Agentic AI a separate product we buy?",a:"It is a full-stack solution rather than one product: NAI plus NKP, AHV, Flow and Nutanix Unified Storage, integrated with NVIDIA AI Enterprise. Some parts are GA and some were early access, with the full solution targeted for the second half of 2026."}],next:["Play the Overview first: the whole product in six scenes, from four teams each doing AI their own way to one governed platform.","Then open Model endpoint: under Where it runs, keep Your data center and set Model replicas to 2: requests spread over both, then one stops and the other keeps answering.","Set Model replicas to 1 to show the queue, and the pause when the only replica stops.","Pick Air-gapped site under Where it runs: the model comes in as files, with no internet connection.","Open the GPUs tab and pick Share a GPU: one small model wastes a whole GPU until MIG slices it. Then Span GPUs for a model too big for one GPU, and Hibernate to free GPUs without deleting an endpoint.","Open Faster answers for speculative decoding, then Models and data for fine-tuning, roles and sharing, and grounded answers.","Open the Agent Gateway tab: one address for every model, a fallback when the NAI endpoint fails, the looping coding agent capped, then a tool write blocked and logged.","Then open Kubernetes Platform for what the endpoint runs on."],then:["nkp"]},Xo=[{year:"2023",title:"Beacon is announced",tone:"ink",text:"At .NEXT in May 2023, Nutanix described Project Beacon as a multi-year vision: build an app once, run it anywhere, and let its data services come along. Databases as a service were named first; Nutanix Database Service (NDB) ships today, though the run-anywhere service in the vision is broader.",piece:{name:"Database Service (NDB)",short:"NDB" e generally available on December 9, 2025, on Z3 and C4 bare-metal instances in 17 regions at launch, expanding over time. One card on the NC2 product page still says preview; the GA announcement and the NC2 FAQ are the current statements."},{q:"Do we have to change our applications to run them on NC2?",a:"No. VMs run on the same AHV hypervisor, so they move as they are; with the right network design they can keep their IP and MAC addresses. Modernizing to native cloud services can come later, app by app."},{q:"Can we use Cloud Native AOS on AKS or GKE?",a:"Not confirmed today. Cloud Native AOS 1.0 is generally available on Amazon EKS. Bare-metal support is tied to NKP Metal, which is in early access with GA targeted for the second half of 2026. Check current status before planning."}],next:["Under Use case, start with Disaster recovery on AWS: replication, the site going down and the VMs powering on in the cloud.","Pick Burst capacity to show cloud nodes added for a peak and released afterwards.","Pick Data-center exit to show workloads moving in waves and the building being retired.","Change Cloud to Azure or Google Cloud: the picture stays the same, which is the point.","Then open Disaster Recovery for the policies, Migration with Nutanix Move for the move itself or Cloud Native AOS for containers."],then:["nci/dr","nci/move","cnaos"]},LC="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20xmlns:xlink='http://www.w3.org/1999/xlink'%20version='1.1'%20fill='%23049fd9'%20id='svg24'%20viewBox='0%200%20216%20114'%3e%3cpath%20d='m%20106.48,76.238%20c%20-0.282,-0.077%20-4.621,-1.196%20-9.232,-1.196%20-8.73,0%20-13.986,4.714%20-13.986,11.734%200,6.214%204.397,9.313%209.674,10.98%200.585,0.193%201.447,0.463%202.021,0.653%202.349,0.739%204.224,1.837%204.224,3.739%200,2.127%20-2.167,3.504%20-6.878,3.504%20-4.14,0%20-8.109,-1.184%20-8.945,-1.395%20v%208.637%20c%200.466,0.099%205.183,1.025%2010.222,1.025%207.248,0%2015.539,-3.167%2015.539,-12.595%200,-4.573%20-2 (h9,{t:n})}),t(ne,{items:[{color:"var(--ink)",label:"Controller VM (CVM), the storage client"},{color:"var(--flow)",label:"Storage traffic"},{color:"var(--flow)",label:"Disk-to-volume mapping",dashed:!0},{color:"var(--line-2)",label:"Array snapshot"}]}),t(J,{clock:e,label:"External storage animation",extra:t(q,{why:"Simplified and compressed: node, VM and volume counts are an example, and the build-up plays in seconds. Supported servers, array models, versions and limits differ by array and release; check the Compatibility Matrix."})})]})}const m9=[{id:"ext",label:"Nutanix with external storage"},{id:"esxi",label:"ESXi on Nutanix"}];function f9(){const[e,n]=ee("tab","ext",["ext","esxi"]);return t(ko,{label:"Ways to start",value:e,tabs:m9,onChange:n,children:[e==="ext"&&t(p9,{}),e==="esxi"&&t(o9,{})]})}const y9={path:"partial",title:"Don’t want the full stack?",tag:"Infrastructure",summary:"Two ways to start with part of Nutanix: run AHV and Prism on compute-only nodes with the storage array you already own, or keep VMware ESXi as the hypervisor on Nutanix nodes and storage.",priority:"P1",talk:["Not every customer wants to replace hypervisor, storage and management at once. This page shows the two partial starting points, and why each one appeals.","External storage: keep the array. AHV compute-only nodes reach Everpure FlashArray or Dell PowerStore over NVMe/TCP, Dell PowerFlex through Dell’s own client, and NetApp ONTAP, which is only announced, over NFS.","The value is reuse and independent scaling: leave vSphere without a storage refresh, add compute without buying storage and keep Prism, Flow Network Security and DR orchestration on top. Licensing is per core, as Nutanix Cloud Infrastructure (NCI) Compute.","ESXi on Nutanix: keep vSphere. vCenter, vMotion, HA and DRS keep working, while a Controller VM (CVM) on every host owns the drives and pools them into one datastore. No SAN to run, and existing VMware licenses stay.","It is also a stepping stone. Switch to “Convert to AHV later”: hosts change hypervisor one at a time in place, or teams move with Nutanix Move or a DR failover. Replication already works between ESXi and AHV clusters.","Be precise on availability: NetApp ONTAP was announced in April 2026 and is not generally available yet, FlashArray needs a new Nutanix cluster, and Flow and Nutanix Cloud Clusters (NC2) need AHV."],numbers:[{k:"Arrays generally available",v:"Dell PowerFlex (Apr 2025), Everpure FlashArray (Dec 2025), Dell PowerStore (AOS 7.6, Jul 2026)"},{k:"Announced, not yet generally available",v:"NetApp ONTAP (AFF A-series, select FAS) over NFS, planned for an upcoming Nutanix Cloud Infrastructure release"},{k:"Array protocol",v:"NVMe/TCP on Ethernet; PowerFlex uses Dell’s client (SDC); NetApp uses NFS"},{k:"Volumes",v:"One array volume per VM disk, with the array’s own snapshots and clones, on the generally available arrays"},{k:"FlashArray cluster",v:"3 to 32 nodes, one FlashArray, new cluster only"},{k:"External storage license",v:"NCI Compute (NCI-C), priced per core"},{k:"ESXi cluster size",v:"Up to 48 hosts (vSphere 7.0, AOS 6.8)"},{k:"vSphere 8 end of general support",v:"Oct 2027, as Nutanix states it"}],qa:[{q:"Can we use our NetApp array?",a:"Not yet. Nutanix and NetApp announced ONTAP support over NFS in April 2026, for AFF A-series and some FAS systems, and in mid-October 2026 it was still planned for this fall with an upcoming Nutanix Cloud Infrastructure (NCI) release (NetApp’s own blog names NCI 7.6.0.10). The page lists it with the other arrays, marked as announced. Today the generally available arrays are Everpure FlashArray, Dell PowerStore and Dell PowerFlex."},{q:"Can we attach our existing Nutanix cluster to the array?",a:"Not with FlashArray: Everpure documents it as a new (greenfield) Nutanix cluster only, though the array itself can be one you already own. For PowerStore and PowerFlex we have not found a published answer, so check before planning on it."},{q:"Is ESXi on Nutanix still supported after Broadcom’s changes?",a:"Yes. Nutanix still lists ESXi as a supported hypervisor and says you can keep running vSphere on-premises with your existing VMware licenses; Broadcom now sells vSphere as VMware vSphere Foundation (VVF) or VMware Cloud Foundation (VCF) subscriptions. Features built for AHV, such as Flow Network Security, Flow Virtual Networking and NC2 in the public cloud, need AHV. Check the compatibility matrix for the qualified ESXi versions."}],next:["Start on the “Nutanix with external storage” tab and let the loop run: the array stays, compute nodes connect and each VM disk becomes its own volume.","Point at Works with: three arrays are generally available and NetApp ONTAP is announced.","Open the “ESXi on Nutanix” tab, play Stay on ESXi, then set Path to Convert to AHV later.","Then open Migration with Nutanix Move for how VMs get across, Legacy vs Nutanix HCI for how the full stack scales or Disaster Recovery for failover to a full Nutanix cluster."],then:["nci/move","nci/hci","nci/dr"]},La=[{content:pg,Component:Xx,icon:"layers",parent:""},{content:Ak,Component:kk,icon:"combine",parent:"nci"},{content:N3,Component:$3,icon:"server",parent:"nci"},{content:j3,Component:q3,icon:"zap",parent:"nci"},{content:A4,Component:k4,icon:"shield",parent:"nci"},{content:D5,Component:I5,icon:"clone",parent:"nci"},{content:U4,Component:G4,icon:"power",parent:"nci"},{content:S6,Component:M6,icon:"upgrade",parent:"nci"},{content:L6,Component:D6,icon:"net",parent:"nci"},{content:i5,Component:r5,icon:"lock",parent:"nci"},{content:Z5,Component:J5,icon:"key",parent:"nci"},{content:S5,Component:M5,icon:"globe",parent:"nci"},{content:w8,Component:m8,icon:"move",parent:"nci"},{content:W8,Component:$8,icon:"edge",parent:"nci"},{content:X8,Component:Y8,icon:"api",parent:""},{content:FA,Component:WA,icon:"gauge",parent:""},{content:XA,Component:YA,icon:"k8s",parent:""},{content:gM,Component:yM,icon:"eye",parent:""},{content:_M,Component:PM,icon:"file",parent:""},{content:HM,Component:BM,icon:"container",parent:""},{content:QM,Component:XM,icon:"db",parent:""},{content:wC,Component:gC,icon:"ai",parent:""},{content:CC,Component:SC,icon:"beacon",parent:""},{content:DC,Component:VC,icon:"cloud",parent:""},{content:QC,Component:XC,icon:"oem",parent:""},{content:y9,Component:f9,icon:"puzzle",parent:""}],g9={"nci/scale":"nci/hci"};function Ra(e){const n=g9[e]??e;return La.find(o=>o.content.path===n)}const w9=[{term:"AHV",full:"Nutanix AHV hypervisor",def:"Nutanix’s own hypervisor, built on Linux KVM. It runs the virtual machines on each node and is managed through Prism."},{term:"AOS",full:"Acropolis Operating System",def:"The Nutanix software that turns a group of servers into one cluster: storage, data protection, management services and APIs."},{term:"Autopathing / iSCSI redirector",def:"If the storage controller (CVM) on a host stops, that host’s VMs keep running and their storage I/O is redirected over the network to CVMs on other nodes. On ESXi and Hyper-V this is called autopathing; on AHV the iSCSI redirector does it."},{term:"Block",def:"A physical chassis that holds one to four nodes. Block awareness keeps copies of data in different blocks so a whole-chassis failure loses nothing."},{term:"Category",def:"A key/value tag (for example AppTier: Web) attached to VMs. Flow security policies and DR protection policies target categories instead of IP addresses or VM names."},{term:"Cluster",def:"A group of nodes managed as one system. Storage from every node is pooled and protected across the whole cluster."},{term:"Curator",def:"The AOS background service that scans metadata and runs cluster-wide jobs: re-protecting data after failures, disk balancing, tiering, erasure coding and cleanup."},{term:"CVM",full:"Controller VM",def:"A virtual machine on every node that runs the AOS services. Together the CVMs form the distributed storage controller, so storage performance and capacity grow with each node."},{term:"Data locality",def:"A VM’s data is kept on the node where the VM runs, so reads are served locally without crossing the network. After a VM moves, data it reads is gradually copied to its new node."},{term:"DSF",full:"Distributed Storage Fabric",def:"The storage layer of AOS. It pools the local drives in every node into one storage pool and keeps multiple copies (or parity) of every piece of data on different nodes."},{term:"EC-X",full:"Erasure coding",def:"Saves capacity on write-cold data by replacing full copies with parity spread across nodes. A 4/1 strip needs 1.25× the space instead of 2× for two full copies."},{term:"Extent / extent group",def:"The units AOS uses to store and track data. Placement and protection are managed per extent group, which is why recovery can target exactly the data that lost a copy."},{term:"Flow",def:"Nutanix software-defined networking and security: microsegmentation (Flow Network Security) and overlay virtual networks / VPCs (Flow Virtual Networking)."},{term:"HA",full:"High availability",def:"If a host fails, its VMs are restarted on the surviving hosts. With memory reservation enabled, enough capacity is held back to guarantee those restarts."},{term:"ILM",full:"Information lifecycle management",def:"Moves data between storage tiers based on how often it is used: hot data on the fastest media, cold data on capacity media."},{term:"LCM",full:"Life Cycle Manager",def:"The upgrade tool in Prism. It inventories software and firmware, picks a safe order, runs pre-checks and upgrades one node at a time while workloads keep running."},{term:"Metro Availability",def:"Synchronous replication between two sites close enough (low round-trip latency) that every write is committed at both before it is acknowledged, for zero data loss."},{term:"NC2",full:"Nutanix Cloud Clusters",def:"The same Nutanix stack (AOS and AHV) running on bare-metal instances in a public cloud, managed with the same tools as on-premises clusters."},{term:"NCI-C",full:"NCI Compute",def:"The Nutanix license for compute-only nodes that use an external storage array: AHV, Prism and DR automation, priced per core, with snapshots and clones left to the array."},{term:"NCM",full:"Nutanix Cloud Manager",def:"Operations, automation, cost governance and security compliance on top of the platform. Feature availability depends on license tier."},{term:"NDB",full:"Nutanix Database Service",def:"Database provisioning, patching, cloning and point-in-time recovery as a service, built on AOS snapshots and log capture."},{term:"NDK",full:"Nutanix Data Services for Kubernetes",def:"Snapshots, replication and disaster recovery for Kubernetes apps. It protects an app’s Kubernetes resources and its data together, as one unit."},{term:"NKP",full:"Nutanix Kubernetes Platform",def:"Nutanix’s platform for deploying and managing fleets of Kubernetes clusters across data center, edge and cloud."},{term:"Node",def:"One server: CPU, memory, drives and network, running a hypervisor plus a CVM."},{term:"NVMe/TCP",def:"A way to reach NVMe storage over ordinary Ethernet and TCP/IP, with no Fibre Channel network. Nutanix compute nodes use it to reach Everpure FlashArray and Dell PowerStore."},{term:"OpLog",def:"A fast write buffer on each CVM for bursty random writes. Writes land there, are copied to other nodes, are acknowledged, and are later drained to the extent store in large sequential chunks."},{term:"Prism Central",def:"The management console for many clusters. It runs as one VM or a small scale-out set of VMs and hosts multi-cluster features."},{term:"Prism Element",def:"The management interface built into every cluster. It manages that one cluster."},{term:"Rack awareness",def:"Keeps copies of data in different racks so losing a whole rack (power or top-of-rack switch) does not lose data."},{term:"RF",full:"Replication factor",def:"How many full copies of data the cluster keeps. RF2 keeps two copies on different nodes and survives one failure, with at least 3 nodes; RF3 keeps three and survives two, with at least 5."},{term:"RPO",full:"Recovery point objective",def:"The most data you can afford to lose, measured in time. An RPO of 1 hour means a recovery may lose up to the last hour of changes."},{term:"RTO",full:"Recovery time objective",def:"How long it may take to get an application running again after a disaster."},{term:"Stargate",def:"The AOS service that handles all storage I/O for its node: it receives VM reads and writes, manages caches and replicates writes to other CVMs."},{term:"vDisk",def:"A virtual disk as AOS sees it: any file over a small size that a VM or service reads and writes, such as a VM’s disk."},{term:"Witness",def:"A small VM at a third location that arbitrates when two sites (or a two-node cluster’s nodes) lose contact, so the right side keeps running automatically."},{term:"Zookeeper",def:"Stores the cluster’s configuration. It runs on 3 nodes (5 at redundancy factor 3) and needs a majority of them up to operate."},{term:"AIOps",full:"Artificial intelligence for IT operations",def:"In Cloud Manager (NCM), Intelligent Operations: it learns each VM’s normal behavior, flags what falls outside it and forecasts when capacity runs out."},{term:"Canary",def:"One small cluster upgraded first, so a failed health check stops a rollout before the rest of the fleet is touched."},{term:"Cluster API",def:"The upstream Kubernetes project NKP uses to create, upgrade and scale clusters from declared settings."},{term:"Cost Governance",def:"The Cloud Manager (NCM) component, formerly Beam, that meters cost and keeps budgets and savings recommendations."},{term:"FSVM",full:"File Server VM",def:"The VMs that run a Nutanix Files file server and serve its shares, spread across the cluster’s nodes."},{term:"HCI",full:"Hyperconverged infrastructure",def:"Compute and storage software running together on standard servers, pooled into one cluster, instead of separate servers, a SAN and a storage array."},{term:"LACP",full:"Link Aggregation Control Protocol",def:"A standard way to bond a host’s network links with the switch so traffic can use the links together."},{term:"NAI",full:"Nutanix Enterprise AI",def:"Nutanix software for deploying and managing AI model inference endpoints on Kubernetes."},{term:"NCI",full:"Nutanix Cloud Infrastructure",def:"The infrastructure layer: AOS storage, the AHV hypervisor, Flow networking and security, and disaster recovery."},{term:"NIM",full:"NVIDIA Inference Microservices",def:"NVIDIA’s packaged, optimized model containers, which Nutanix Enterprise AI can deploy."},{term:"NKP Metal",def:"The NKP option for running Kubernetes directly on bare-metal servers, without a hypervisor; in early access."},{term:"Nutanix Central",def:"The console above many Prism Central instances: one place to see and manage every region and site. Offered as SaaS and on-premises."},{term:"NUS",full:"Nutanix Unified Storage",def:"Files, Objects and Volumes on one platform: file shares, S3-compatible object storage and block storage over iSCSI."},{term:"ROBO",full:"Remote office / branch office",def:"Small sites away from the data center, often run on one-, two- or three-node clusters."},{term:"Security Compliance",def:"The Cloud Manager (NCM) component, formerly Security Central, that checks settings against a baseline and catches drift."},{term:"SED",full:"Self-encrypting drive",def:"A drive that encrypts data in its own hardware, with its keys held by a key manager."},{term:"Self-Service",def:"The Cloud Manager (NCM) component, formerly Calm, that offers a catalog of blueprints with quotas and approvals."},{term:"UBA",full:"User behavior analytics",def:"In Data Lens, learning how users normally access files and flagging unusual access, such as many files encrypted in a short time."},{term:"VPC",full:"Virtual private cloud",def:"With Flow Virtual Networking, a private network built in software, with its own subnets and routing, kept apart from other VPCs."},{term:"WORM",full:"Write once, read many",def:"A setting that stops data from being changed or deleted for a set retention period, used against ransomware and for compliance."},{term:"SAN",full:"Storage area network",def:"A separate network, usually Fibre Channel or iSCSI, that connects servers to a shared storage array."},{term:"HBA",full:"Host bus adapter",def:"The card in a server that connects it to a Fibre Channel storage network."},{term:"LUN",full:"Logical unit number",def:"A slice of an array’s storage that hosts see as one disk."},{term:"Fibre Channel",def:"The specialized storage network a traditional SAN runs on, with its own switches, cabling and skills."},{term:"Zoning / LUN masking",def:"SAN settings that decide which hosts reach which array ports (zoning, on the switches) and which LUNs they see (masking, on the array)."},{term:"Prism",def:"The Nutanix management console: Prism Element is built into every cluster, and Prism Central manages many clusters."},{term:"Content cache",def:"The read cache in each CVM’s memory (the Nutanix Bible calls it the unified cache). Data read once is kept briefly; data read again stays longer."},{term:"Extent store",def:"Where data lives long term, on each node’s drives. The OpLog drains into it, and large sequential writes go straight to it."},{term:"Snapshot",def:"A read-only point-in-time copy of a virtual disk, made by copying its map of blocks, not the data. A local restore point, not a backup."},{term:"Clone",def:"A new writable disk made from a snapshot’s map, sharing every block with it until a block changes."},{term:"Redirect-on-write",def:"After a snapshot, new writes go to new blocks and only the live disk’s map changes, so the snapshot keeps pointing at the old blocks."},{term:"Block awareness",def:"Placement that keeps the copies of each piece of data in different blocks (chassis), so a whole block can fail without losing data."},{term:"OVS",full:"Open vSwitch",def:"The virtual switch software on every AHV host."},{term:"LAG",full:"Link aggregation group",def:"Two or more switch ports combined into one link, the switch side of LACP. MLAG and vPC spread it across two switches."},{term:"MTU",full:"Maximum transmission unit",def:"The largest packet a network link carries. Overlay networks add a header, so they need a larger MTU underneath."},{term:"Geneve",full:"Generic Network Virtualization Encapsulation",def:"The envelope Flow Virtual Networking wraps around VPC traffic between hosts."},{term:"NAT",full:"Network address translation",def:"Swapping a private address for a public one. Source NAT lets many VMs share an address; a floating IP maps one public address to one VM."},{term:"NearSync",def:"Asynchronous replication with recovery points every 1 to 15 minutes."},{term:"STIG",full:"Security Technical Implementation Guide",def:"A hardening checklist from the US Defense Information Systems Agency (DISA). Nutanix publishes one for AOS."},{term:"FIPS 140",full:"Federal Information Processing Standard 140",def:"The US standard for validating cryptographic modules, such as those that encrypt data at rest."},{term:"iSCSI",def:"Block storage over ordinary Ethernet; Nutanix Volumes serves disks to outside hosts this way."},{term:"NFS / SMB",def:"The two file-sharing protocols: NFS for Linux and UNIX clients, SMB for Windows. Nutanix Files serves both."},{term:"S3",def:"The object storage API defined by Amazon. Nutanix Objects is S3-compatible."},{term:"Time Machine",def:"NDB’s protection for each database: snapshots plus captured transaction logs, so any moment in the retention window can be restored or cloned."},{term:"Data Lens",def:"Nutanix’s data security service for Files and Objects: spots ransomware and unusual access, keeps audit trails and helps recovery. SaaS or on-premises."},{term:"GA",full:"General availability",def:"A release open to every customer, rather than early access or a tech preview."},{term:"LLM",full:"Large language model",def:"The kind of AI model Nutanix Enterprise AI serves through an inference endpoint."},{term:"MCP",full:"Model Context Protocol",def:"The open protocol AI agents use to call tools; Nutanix Enterprise AI’s MCP Gateway governs that access."},{term:"EKS",full:"Amazon Elastic Kubernetes Service",def:"AWS’s managed Kubernetes, where Cloud Native AOS 1.0 runs."},{term:"VCF / VVF",full:"VMware Cloud Foundation / vSphere Foundation",def:"The two subscription bundles Broadcom sells vSphere in."},{term:"SDC",full:"Dell Storage Data Client",def:"The client that lets Nutanix compute nodes reach Dell PowerFlex storage."}],b9=`ISC License
