etwork Security keeps firewall rules with each VM by its labels on every host, and Flow Virtual Networking builds virtual private clouds (VPCs) in software without touching the physical network.",priority:"P0",talk:["Flow Network Security is a stateful, distributed firewall in AHV. Rules name categories such as AppTier: Web, not IP addresses. Next-Gen, the current generation, comes with AOS 7.6 and Prism Central pc.7.6; legacy clusters need a planned upgrade and a separate policy migration.","Start in Monitor: everything still flows, and the rule-hit log shows exactly what a policy would block. Switch to Enforce once the log is clean.","Application policies allow only the listed flows into an app; everything else is denied by default. Isolation policies wall off environments such as Production and Dev. Quarantine removes a VM from the network in one click.","Enforcement happens at each VM’s network interface in the hypervisor and is keyed to categories, so the policy moves with a VM when it live-migrates. No rule or address list changes.","Flow Virtual Networking adds VPCs: overlay networks with their own subnets, routing, network address translation (NAT) and floating IPs. Traffic between hosts is wrapped in Geneve, so the physical network only needs host-to-host reachability.","For the network team, a new project on VPCs needs no new VLAN, trunk, gateway or unique IP range."],numbers:[{k:"Policy types",v:"Application, Isolation, Quarantine (Strict or Forensic), Shared Services, VDI (virtual desktop infrastructure; by release)"},{k:"Current release",v:"Flow Network Security Next-Gen 7.6 (Oct 2026), bundled with AOS 7.6 and Prism Central pc.7.6; adds rule-centric policies and policies by fully qualified domain name (FQDN)"},{k:"Policy states (Prism)",v:"Saved, Monitoring, Enforced"},{k:"Overlay encapsulation",v:"Geneve between AHV hosts; VTEP (virtual tunnel endpoint) gateways use VXLAN (Virtual Extensible LAN)"},{k:"Geneve overhead",v:"58 bytes per packet; Dynamic d Infrastructure",summary:"Encryption at rest keeps a stolen drive unreadable and, with keys on your own key server, a stolen node too. It does not protect against an attacker inside a running VM.",priority:"P1",talk:["Start with the threat. Encryption at rest protects drives and nodes that leave your control: stolen, sent back for repair or thrown away. It does nothing against an attacker inside a running VM.","Two ways to encrypt: software encryption in AOS on ordinary drives, which Nutanix positions for most cases, or self-encrypting drives (SEDs) when policy requires hardware encryption. They can be layered (dual encryption).","Apps see no change: data is encrypted before it reaches a drive and decrypted for any authorized reader.","Keys can be held by the cluster itself in the built-in key manager, with no extra server, or by your existing external key manager, which keeps keys and data in different places. That matters if a whole node walks out.","Hardening is built in too. On AOS 7.6, Prism Central pc.7.6 and AHV 11.2, a security profile (Standard, Elevated or Strict) is checked every 2 hours; drift is fixed where possible, and changes needing a host reboot raise an alert."],numbers:[{k:"Encryption options",v:"Software (AOS), self-encrypting drives or both"},{k:"Key management",v:"Built-in key manager (native, on the cluster) or external key manager; options vary by release and configuration"},{k:"Software encryption module",v:"FIPS 140-2 Level 1 (per Nutanix); check the current certificate for your release"},{k:"Security profiles",v:"Standard, Elevated, Strict (AOS 7.6, pc.7.6, AHV 11.2; AOS layer only on other hypervisors)"},{k:"Drift check",v:"Every 2 hours; fixed automatically where possible, otherwise an alert"}],qa:[{q:"Do we need self-encrypting drives?",a:"Usually not. Software encryption works on standard drives and is what Nutanix positions for most use cases. SEDs make sense when a policy or regulation specifically requires hardware-based encryption."},{q:"Does encryption protect us from ransomware?",a:"No. Ransomware writes through the VM like any application, so its output is simply stored, encrypted at rest like everything else. Defend with microsegmentation (Flow Network Security), detection on file shares (Data Lens) and good recovery points (snapshots and disaster recovery)."},{q:"Will this pass our compliance audit?",a:"It helps, but no product makes you compliant on its own. Nutanix and the Defense Information Systems Agency (DISA) developed a Security Technical Implementation Guide (STIG) for AOS, published for AOS 5.20 (check your release), and Nutanix offers a hardening guide. Security profiles keep settings in line; some items (syslog, network segmentation, LDAP) are still configured by you. Feature availability depends on version and license."}],next:["Start on “On · built-in key manager” and “A drive is stolen”: the drive is unreadable. Switch Encryption to “Off” and the same drive is readable.","Choose “A whole node is stolen” and compare “On · built-in key manager” with “On · external key manager”: only the external one keeps the keys away from the stolen node.","Point at “Extra server to run” for the cost of the external key manager: another server to run, back up and keep reachable.","Then open Flow: Network Security & Virtual Networking for traffic between VMs, or Snapshots & Clones and Disaster Recovery for recovery, which encryption at rest does not cover."],then:["nci/flow","nci/snapshots","nci/dr"]},i1=e=>e*60/1024;function y_(e,t){const o=i1(e.mbps),s=e.changeGBPerHour/60,a=[],r=e.vmGB/o;a.push({kind:"seed",start:0,end:r,gb:e.vmGB});const i=s<o;let l=0,c=r,p=0;const h=Math.max(e.cutoverAt,r);let d=0;for(;c<t&&d++<2e3&&!(h!==null&&c>=h);){const x=Math.min(c+e.syncEveryMin,h??1/0,t);if(x>c&&a.push({kind:"idle",start:c,end:x,gb:0}),c=x,h!==null&&c>=h||c>=t)break;const k=(c-l)*s,A=k/o;a.push({kind:"sync",start:c,end:c+A,gb:k}),p=k,l=c,c+=A}let u=null,f=null,m=null;if(h!==null){m=Math.max(c re to Nutanix, on-premises or in Nutanix Cloud Clusters (NC2), copying while the VM runs so downtime is only a short cutover.",priority:"P1",talk:["Move is included at no extra cost for Nutanix customers and has been around for about ten years, so it is a well-trodden path.","Three phases: a seed copy while users keep working, incremental syncs that carry only changes, then a cutover.","Downtime is only the cutover: a final small sync plus the power-on, so its length depends on change rate, bandwidth and boot time. Compare it with shutting down and copying everything.","Before the cutover, Move can prepare the guest OS for AHV, for example by installing drivers, automatically or manually depending on the OS and the access you give it.","The honest limit: if a VM changes data faster than the link can copy it, syncs never catch up. The fix is more bandwidth or a quieter time.","Sources include vSphere/ESXi, Hyper-V, AWS EC2, Azure, VMware Cloud on AWS, Azure VMware Solution, AHV and file shares; targets are AHV on-premises and NC2. Supported pairs change by Move release, so check the support matrix."],numbers:[{k:"Cost",v:"No extra cost for Nutanix customers"},{k:"Current release",v:"Move 6.3.3 (Oct 2026; for new Move deployments, not upgrades)"},{k:"Targets",v:"AHV on-premises; NC2 on AWS, Azure, Google Cloud, OVHcloud"},{k:"File shares",v:"SMB v2+, NFS v3 sources"}],qa:[{q:"How much downtime should we plan per VM?",a:"Typically minutes: the final sync of changes since the last incremental, plus the time to power on and check the VM. It depends on change rate, bandwidth and boot time, so measure it during a pilot wave."},{q:"Can we migrate without copying the data at all?",a:"For ESXi to AHV, Move 6.3 added zero-copy migration when the VM disks already sit on a supported external array, such as Everpure FlashArray, that the AHV cluster also uses. Otherwise Move copies the data, using the seed and incremental approach shown here."},{q:"Do we need to change IP addresses?",a:"Not necessarily. Many migrations keep IP addresses by extending or recreating the same networks on the target. That is a network design decision to make before the first wave."}],next:["Start with Source platform set to “VMware ESXi”: point at the seed copy while users keep working on the source.","Pause while it is in sync to show that only changed blocks travel.","Let it reach the cutover and compare the downtime with “Shut down, then copy all”.","Switch Source platform to “Hyper-V”, “AWS EC2” or “Azure”: the pattern is the same.","Then open Hybrid & Public Cloud for NC2 targets and keeping IP addresses."],then:["cloud"]},qh=[{id:"drive",label:"Drive fails",tip:"One drive in a node stops working."},{id:"node",label:"Node fails",tip:"A whole node goes down: power, motherboard or similar."},{id:"peer",label:"Nodes lose contact",tip:"The network between the nodes breaks while every node keeps running."},{id:"wan",label:"Link to the data center drops",tip:"The site loses its connection to the data center where Prism Central (and, for two nodes, the Witness) runs."},{id:"upgrade",label:"Planned upgrade",tip:"LCM upgrades AOS and AHV at the site."},{id:"expand",label:"Add a node",tip:"The site needs more room, so one more node arrives."}],pr=[{id:"1",label:"1 node",nodes:1},{id:"2",label:"2 nodes + Witness",nodes:2},{id:"3",label:"3 nodes",nodes:3}],R_={1:{k:"Site runs normally",text:"One node runs every VM at the site. Prism Central in the data center watches it over the WAN.",tone:"ok"},2:{k:"Site runs normally",text:"Two nodes share the VMs and each holds a copy of all data. A small Witness VM in the data center breaks ties.",tone:"ok",mode:"Two-node mode"},3:{k:"Site runs normally",text:"Three nodes share the VMs and keep two copies of all data, on different nodes.",tone:"ok"}},oh=(e=[])=>[{k:"Link drops",text:"The WAN link to the data center drops.",tone:"warn",wan:!0},{k:"Site keeps running",text:"The cluster keeps running its VMs and can still be managed locally in Prism Element. Central monitoring waits for the link.",tone:"ok",wan:!0},...e,{k:"Link returns",text:"When the link is back, Prism Central sees the site again.",tone:"ok"}],d1={1:{drive:[{k:"Drive fails",text:"A drive in the node fails.",tone:"warn",disk:[0,1]},{k:"Rebuilt inside the node",text:"Data copies are kept on different drives in the node, so the lost copies are rebuilt onto the remaining drives, if there is free capacity.",tone:"warn",disk:[0,1],heal:[[0,0]]},{k:"SSD fails instead",text:"If the failed drive is an SSD, the cluster can go read-only until it is replaced.",tone:"bad",disk:[0,1]},{k:"Drive replaced",text:"Replace the drive and protection is back to normal.",tone:"ok"}],node:[{k:"Node fails",text:"The node fails.",tone:"bad",down:[0]},{k:"Site goes down",text:"Every VM at the site stops. There is no second node to restart them on.",tone:"bad",down:[0],vmsOff:!0},{k:"Recovery",text:"Recover by repairing the node, or from a backup or replica elsewhere. Nutanix guidance limits async from a single node to a 6-hour RPO.",tone:"bad",down:[0],vmsOff:!0}],wan:oh(),upgrade:[{k:"VMs shut down first",text:"LCM can upgrade AOS and AHV, but first you shut down every guest VM.",tone:"warn",vmsOff:!0},{k:"Storage goes offline",text:"The only Controller VM (CVM) and host go down, so storage is offline during the upgrade.",tone:"bad",down:[0],planned:!0,vmsOff:!0},{k:"Firmware updated by hand",text:"LCM does not upgrade firmware on a single node; that is done manually.",tone:"warn",vmsOff:!0},{k:"VMs start again",text:"The node comes back and you start the VMs again.",tone:"ok"}],expand:[{k:"A node arrives",text:"The site needs more room, so a second node arrives.",tone:"ink",extra:"new"},{k:"It cannot join",text:"A single-node cluster cannot be expanded. Adding a node to it is not supported, so the new node cannot simply join.",tone:"bad",extra:"blocked",illus:"From Nutanix community answers and the expansion error AOS shows; check the Expanding a Cluster guide for your release."},{k:"New cluster built",text:"The way forward is a new cluster on the new hardware. Replicate the VMs to it, for example with Nutanix disaster recovery, then move the site over.",tone:"warn",extra:"cluster",heal:[[0,1]]},{k:"Old node reused",text:"Once the VMs run on the new cluster, the old node is re-imaged and added to it as one more node.",tone:"ok",extra:"cluster",vmsTo:[1]}]},2:{drive:[{k:"Drive fails",text:"A drive fails on N1.",tone:"warn",disk:[0,1]},{k:"Other node holds a copy",text:"Every piece of data also has a copy on N2: data is kept as two copies, one per node, and metadata as four copies across both.",tone:"warn",disk:[0,1]},{k:"Copies rebuilt",text:"The lost copies are rebuilt if there is free capacity. Replace the drive to restore full capacity.",tone:"ok",disk:[0,1],heal:[[1,0]]}],node:[{k:"Node fails",text:"N1 fails.",tone:"bad",down:[0]},{k:"Switching to single-node mode",text:"Within about 30 to 60 seconds N2 switches to single-node mode. Guest disk timeouts of at least 60 seconds let VMs ride through the switch.",tone:"warn",down:[0],mode:"Single-node mode"},{k:"HA restarts",text:"HA restarts N1’s VMs on N2. N1 is detached from the metadata ring.",tone:"warn",down:[0],vmsTo:[1],mode:"Single-node mode"},{k:"Copies re-created on one node",text:"N2 keeps two copies of the data on different drives of its own, if it has room. That is why a two-node site is sized to run on one node, with disk and memory at about 40% or less.",tone:"warn",down:[0],vmsTo:[1],mode:"Single-node mode",heal:[[1,1]]},{k:"N1 repaired",text:"N1 is repaired. After about 15 minutes of steady heartbeat, the cluster starts resyncing back to two-node mode.",tone:"warn",vmsTo:[1],mode:"Resyncing",heal:[[1,0]]},{k:"Back in two-node mode",text:"The resync can take hours, depending on how much data changed. Then the cluster is back in two-node mode with resiliency OK.",tone:"ok",vmsTo:[1],mode:"Two-node mode"}],peer:[{k:"Nodes lose contact",text:"The li  catalog; quota and approval policy are checked before anything is created, and the result arrives with owner, project and categories set. Over quota, the request is sent back with the reason.","Cost: dev-test runs hot. Cost Governance meters it daily at your rates, alerts the owner in time to act, and lists idle and oversized VMs. Self-Service quota, approval and scheduler policies stop it coming back.","Security Compliance scans settings against a baseline, suggests a fix per finding and catches drift. Tiers: Starter covers forecasting and right-sizing, Pro adds Cost Governance and Self-Service, Ultimate adds Security Compliance, multi-VM blueprints and approvals."],numbers:[{k:"NCM components",v:"Intelligent Operations · Self-Service · Cost Governance · Security Compliance"},{k:"Self-Service & Cost Governance",v:"From NCM Pro"},{k:"Security Compliance, multi-VM blueprints, approvals",v:"NCM Ultimate"},{k:"Current release",v:"NCM 2.1 (Aug 2026)"},{k:"NCM 2.x",v:"2.0 GA Apr 2026 · requires Nutanix Central on-premises"},{k:"Small form factor (NCM 2.1)",v:"3 nodes, about 2,500 VMs"},{k:"Medium form factor (NCM 2.0)",v:"About 10,000 VMs"}],qa:[{q:"Does cost data go to a Nutanix cloud service?",a:"Not in NCM 2.x. From NCM 2.0, Cost Governance runs fully on-premises inside your data center, without a separate SaaS application. Older Beam deployments were SaaS, so check which version you are comparing."},{q:"Does a budget stop the spending by itself?",a:"Not as far as the published material says. Cost Governance budgets track spend and send overspend alerts, and its recommendations show what to stop or right-size; we found no budget setting that switches resources off. The hard limit is the Self-Service project quota, which caps the CPU, memory and storage a project can deploy, with approval and scheduler policies on NCM Ultimate."},{q:"Can it manage our VMware estate too?",a:"NCM 2.x spans multiple Prism Centrals and VMware vCenters, and Intelligent Operations Starter lists ESXi on non-Nutanix infrastructure. Feature coverage differs between AHV and vCenter-managed environments, so map your use cases to the current feature matrix."}],next:["On the AIOps tab, pause on the 3 a.m. spike, flagged by the learned band while the fixed 70% alarm stays silent, then on the 2 p.m. spike, which both catch.","On the Self-Service tab, pick 3-tier web app for the approval step, then App over quota to show a request sent back before anything is created.","On the Cost tab, pause on each numbered step (the alert, the recommendations, the quota and policies) and compare where the month ends with the Left alone line.","On the Security tab, watch findings get fixed, then a setting changed by hand caught by the next scan.","Then open Nutanix Central & Prism Federation to see where NCM 2.x runs."],then:["central"]},ts=[{id:"e1",name:"store-01",site:"edge",infra:"ahv",cp:1,workers:2},{id:"e2",name:"store-02",site:"edge",infra:"ahv",cp:1,workers:2},{id:"e3",name:"store-03",site:"edge",infra:"ahv",cp:1,workers:2},{id:"d1",name:"dc-prod",site:"dc",infra:"ahv",cp:3,workers:4},{id:"d2",name:"dc-vsphere",site:"dc",infra:"vsphere",cp:3,workers:3},{id:"c1",name:"aws-prod",site:"cloud",infra:"aws",cp:3,workers:3}],Er={node:360,check:240},aa=.4,Wa=.8;function S1(e=ts){const t=["edge","dc","cloud"],o=e.slice().sort((i,l)=>t.indexOf(i.site)-t.indexOf(l.site)),[s,...a]=o,r=s?[[s]]:[];for(const i of t){const l=a.filter(c=>c.site===i);l.length&&r.push(l)}return r}function WS({canaryFails:e,fleet:t=ts}){const o=new Map,s=[];let a=0,r=null;return S1(t).forEach((i,l)=>{const c=r!==null;c||s.push(a);let p=a;for(const h of i){const d=h.cp+h.workers;if(c){o.set(h.id,{id:h.id,wave:l,start:1/0,nodesEnd:1/0,end:1/0,nodes:d,fails:!1});continue}const u=e&&l===0,f=a+(u?1:d)*Er.node,m=u?f:f+Er.check;o.set(h.id,{id:h.id,wave:l,start:a,nodesEnd:f,end:m,nodes:d,fails:u}),u&&(r=a+aa*Er.node),p=Math.max(p,m)}a=p}),s.push(a),{clusters:t.map(i=>o.get(i.id)),waves:s,end:a,haltAt:r}}const l itle:"Enterprise AI",tag:"Platform services",summary:"Nutanix Enterprise AI (NAI) runs large language model (LLM) inference endpoints on Kubernetes you control, in your data center or public cloud, and its Agent Gateway governs how apps and agents reach models and tools.",priority:"P2",talk:["Most teams do not want to send sensitive prompts to a shared public service. NAI lets them run models on infrastructure they control.","Pick where it runs: your data center (NKP on Nutanix), public cloud (EKS, AKS or GKE in your own account) or an air-gapped site, which means NKP in your data center with no internet and no Hugging Face.","Each replica loads its own copy of the model onto its GPUs. Apps and agents call one endpoint address with an API token; role-based access control decides who creates endpoints and tokens, with GPU and model monitoring built in. A supported model can span several GPUs; spanning GPU nodes is a tech preview.","The endpoint spreads requests over the replicas. With one replica, requests queue in busy moments, and a stop for an update or a fault means a pause. With two or more, the others keep answering.","Agent Gateway, licensed separately, gives apps one address for every model: your NAI endpoints, a remote NAI cluster or an external provider, with fallback and per-client rate limits. Its Model Context Protocol (MCP) Gateway adds API keys, limits tool actions and logs every call.","Naming: NAI is the product, now at 2.8. Nutanix Agentic AI is the wider full-stack solution around it, and GPT-in-a-Box is the earlier name for the bundle NAI was part of."],numbers:[{k:"Current release",v:"NAI 2.8 (Aug 2026)"},{k:"Runs on",v:"NKP or other CNCF Kubernetes; tested on EKS, AKS and GKE"},{k:"Model sources",v:"NVIDIA Inference Microservices (NIM), Hugging Face, your own files; a catalog of pre-validated models. Air-gapped sites use air-gapped NIM or your own files"},{k:"Licensing",v:"By GPU memory (vCPUs on clusters without GPUs), not tokens"},{k:"Agent Ga  shows the two partial starting points, and why each one appeals.","External storage: keep the array. AHV compute-only nodes reach Everpure FlashArray or Dell PowerStore over NVMe/TCP, Dell PowerFlex through Dell’s own client, and NetApp ONTAP, which is only announced, over NFS.","The value is reuse and independent scaling: leave vSphere without a storage refresh, add compute without buying storage and keep Prism, Flow Network Security and DR orchestration on top. Licensing is per core, as Nutanix Cloud Infrastructure (NCI) Compute.","ESXi on Nutanix: keep vSphere. vCenter, vMotion, HA and DRS keep working, while a Controller VM (CVM) on every host owns the drives and pools them into one datastore. No SAN to run, and existing VMware licenses stay.","It is also a stepping stone. Switch to “Convert to AHV later”: hosts change hypervisor one at a time in place, or teams move with Nutanix Move or a DR failover. Replication already works between ESXi and AHV clusters.","Be precise on availability: NetApp ONTAP was announced in April 2026 and is not generally available yet, FlashArray needs a new Nutanix cluster, and Flow and Nutanix Cloud Clusters (NC2) need AHV."],numbers:[{k:"Arrays generally available",v:"Dell PowerFlex (Apr 2025), Everpure FlashArray (Dec 2025), Dell PowerStore (AOS 7.6, Jul 2026)"},{k:"Announced, not yet generally available",v:"NetApp ONTAP (AFF A-series, select FAS) over NFS, planned for an upcoming Nutanix Cloud Infrastructure release"},{k:"Array protocol",v:"NVMe/TCP on Ethernet; PowerFlex uses Dell’s client (SDC); NetApp uses NFS"},{k:"Volumes",v:"One array volume per VM disk, with the array’s own snapshots and clones, on the generally available arrays"},{k:"FlashArray cluster",v:"3 to 32 nodes, one FlashArray, new cluster only"},{k:"External storage license",v:"NCI Compute (NCI-C), priced per core"},{k:"ESXi cluster size",v:"Up to 48 hosts (vSphere 7.0, AOS 6.8)"},{k:"vSphere 8 end of general support",v:"Oct 2027, as Nutanix states it"}],qa:[{q:"Can we use our NetApp array?",a:"Not yet. Nutanix and NetApp announced ONTAP support over NFS in April 2026, for AFF A-series and some FAS systems, and in mid-October 2026 it was still planned for this fall with an upcoming Nutanix Cloud Infrastructure (NCI) release (NetApp’s own blog names NCI 7.6.0.10). The page lists it with the other arrays, marked as announced. Today the generally available arrays are Everpure FlashArray, Dell PowerStore and Dell PowerFlex."},{q:"Can we attach our existing Nutanix cluster to the array?",a:"Not with FlashArray: Everpure documents it as a new (greenfield) Nutanix cluster only, though the array itself can be one you already own. For PowerStore and PowerFlex we have not found a published answer, so check before planning on it."},{q:"Is ESXi on Nutanix still supported after Broadcom’s changes?",a:"Yes. Nutanix still lists ESXi as a supported hypervisor and says you can keep running vSphere on-premises with your existing VMware licenses; Broadcom now sells vSphere as VMware vSphere Foundation (VVF) or VMware Cloud Foundation (VCF) subscriptions. Features built for AHV, such as Flow Network Security, Flow Virtual Networking and NC2 in the public cloud, need AHV. Check the compatibility matrix for the qualified ESXi versions."}],next:["Start on the “Nutanix with external storage” tab and let the loop run: the array stays, compute nodes connect and each VM disk becomes its own volume.","Point at Works with: three arrays are generally available and NetApp ONTAP is announced.","Open the “ESXi on Nutanix” tab, play Stay on ESXi, then set Path to Convert to AHV later.","Then open Migration with Nutanix Move for how VMs get across, Legacy vs Nutanix HCI for how the full stack scales or Disaster Recovery for failover to a full Nutanix cluster."],then:["nci/move","nci/hci","nci/dr"]},Rr=[{content:dx,Component:cx,icon:"layers",parent:""},{content:Rx,Component:Px,icon:"combine",parent:"nci"},{content:pb,Component:ub,icon:"server",parent:"nci"},{content:Pb,Component:$b,icon:"zap",parent:"nci"},{content:a2,Component:s2,icon:"shield",parent:"nci"},{content:n_,Component:t_,icon:"clone",parent:"nci"},{content:A2,Component:M2,icon:"power",parent:"nci"},{content:H2,Component:z2,icon:"upgrade",parent:"nci"},{content:nk,Component:tk,icon:"net",parent:"nci"},{content:Sk,Component:_k,icon:"lock",parent:"nci"},{content:g_,Component:m_,icon:"key",parent:"nci"},{content:Bk,Component:Dk,icon:"globe",parent:"nci"},{content:P_,Component:T_,icon:"move",parent:"nci"},{content:j_,Component:W_,icon:"edge",parent:"nci"},{content:iS,Component:rS,icon:"api",parent:""},{content:BS,Component:DS,icon:"gauge",parent:""},{content:eM,Component:JS,icon:"k8s",parent:""},{content:hM,Component:dM,icon:"eye",parent:""},{content:TM,Component:CM,icon:"file",parent:""},{content:BM,Component:DM,icon:"container",parent:""},{content:YM,Component:KM,icon:"db",parent:""},{content:uA,Component:hA,icon:"ai",parent:""},{content:xA,Component:wA,icon:"beacon",parent:""},{content:TA,Component:SA,icon:"cloud",parent:""},{content:XA,Component:qA,icon:"puzzle",parent:""}],KA={"nci/scale":"nci/hci"};function Ta(e){const t=KA[e]??e;return Rr.find(o=>o.content.path===t)}const YA=[{term:"AHV",full:"Nutanix AHV hypervisor",def:"Nutanix’s own hypervisor, built on Linux KVM. It runs the virtual machines on each node and is managed through Prism."},{term:"AOS",full:"Acropolis Operating System",def:"The Nutanix software that turns a group of servers into one cluster: storage, data protection, management services and APIs."},{term:"Autopathing / iSCSI redirector",def:"If the storage controller (CVM) on a host stops, that host’s VMs keep running and their storage I/O is redirected over the network to CVMs on other nodes. On ESXi and Hyper-V this is called autopathing; on AHV the iSCSI redirector does it."},{term:"Block",def:"A physical chassis that holds one to four nodes. Block awareness keeps copies of data in different blocks so a whole-chassis failure loses nothing."},{term:"Category",def:"A key/value tag (for example AppTier: Web) attached to VMs. Flow security policies and DR protection policies target categories instead of IP addresses or VM names."},{term:"Cluster",def:"A group of nodes managed as one system. Storage from every node is pooled and protected across the whole cluster."},{term:"Curator",def:"The AOS background service that scans metadata and runs cluster-wide jobs: re-protecting data after failures, disk balancing, tiering, erasure coding and cleanup."},{term:"CVM",full:"Controller VM",def:"A virtual machine on every node that runs the AOS services. Together the CVMs form the distributed storage controller, so storage performance and capacity grow with each node."},{term:"Data locality",def:"A VM’s data is kept on the node where the VM runs, so reads are served locally without crossing the network. After a VM moves, data it reads is gradually copied to its new node."},{term:"DSF",full:"Distributed Storage Fabric",def:"The storage layer of AOS. It pools the local drives in every node into one storage pool and keeps multiple copies (or parity) of every piece of data on different nodes."},{term:"EC-X",full:"Erasure coding",def:"Saves capacity on write-cold data by replacing full copies with parity spread across nodes. A 4/1 strip needs 1.25× the space instead of 2× for two full copies."},{term:"Extent / extent group",def:"The units AOS uses to store and track data. Placement and protection are managed per extent group, which is why recovery can target exactly the data that lost a copy."},{term:"Flow",def:"Nutanix software-defined networking and security: microsegmentation (Flow Network Security) and overlay virtual networks / VPCs (Flow Virtual Networking)."},{term:"HA",full:"High availability",def:"If a host fails, its VMs are restarted on the surviving hosts. With memory reservation enabled, enough capacity is held back to guarantee those restarts."},{term:"ILM",full:"Information lifecycle management",def:"Moves data between storage tiers based on how often it is used: hot data on the fastest media, cold data on capacity media."},{term:"LCM",full:"Life Cycle Manager",def:"The upgrade tool in Prism. It inventories software and firmware, picks a safe order, runs pre-checks and upgrades one node at a time while workloads keep running."},{term:"Metro Availability",def:"Synchronous replication between two sites close enough (low round-trip latency) that every write is committed at both before it is acknowledged, for zero data loss."},{term:"NC2",full:"Nutanix Cloud Clusters",def:"The same Nutanix stack (AOS and AHV) running on bare-metal instances in a public cloud, managed with the same tools as on-premises clusters."},{term:"NCI-C",full:"NCI Compute",def:"The Nutanix license for compute-only nodes that use an external storage array: AHV, Prism and DR automation, priced per core, with snapshots and clones left to the array."},{term:"NCM",full:"Nutanix Cloud Manager",def:"Operations, automation, cost governance and security compliance on top of the platform. Feature availability depends on license tier."},{term:"NDB",full:"Nutanix Database Service",def:"Database provisioning, patching, cloning and point-in-time recovery as a service, built on AOS snapshots and log capture."},{term:"NDK",full:"Nutanix Data Services for Kubernetes",def:"Snapshots, replication and disaster recovery for Kubernetes apps. It protects an app’s Kubernetes resources and its data together, as one unit."},{term:"NKP",full:"Nutanix Kubernetes Platform",def:"Nutanix’s platform for deploying and managing fleets of Kubernetes clusters across data center, edge and cloud."},{term:"Node",def:"One server: CPU, memory, drives and network, running a hypervisor plus a CVM."},{term:"NVMe/TCP",def:"A way to reach NVMe storage over ordinary Ethernet and TCP/IP, with no Fibre Channel network. Nutanix compute nodes use it to reach Everpure FlashArray and Dell PowerStore."},{term:"OpLog",def:"A fast write buffer on each CVM for bursty random writes. Writes land there, are copied to other nodes, are acknowledged, and are later drained to the extent store in large sequential chunks."},{term:"Prism Central",def:"The management console for many clusters. It runs as one VM or a small scale-out set of VMs and hosts multi-cluster features."},{term:"Prism Element",def:"The management interface built into every cluster. It manages that one cluster."},{term:"Rack awareness",def:"Keeps copies of data in different racks so losing a whole rack (power or top-of-rack switch) does not lose data."},{term:"RF",full:"Replication factor",def:"How many full copies of data the cluster keeps. RF2 keeps two copies on different nodes and survives one failure, with at least 3 nodes; RF3 keeps three and survives two, with at least 5."},{term:"RPO",full:"Recovery point objective",def:"The most data you can afford to lose, measured in time. An RPO of 1 hour means a recovery may lose up to the last hour of changes."},{term:"RTO",full:"Recovery time objective",def:"How long it may take to get an application running again after a disaster."},{term:"Stargate",def:"The AOS service that handles all storage I/O for its node: it receives VM reads and writes, manages caches and replicates writes to other CVMs."},{term:"vDisk",def:"A virtual disk as AOS sees it: any file over a small size that a VM or service reads and writes, such as a VM’s disk."},{term:"Witness",def:"A small VM at a third location that arbitrates when two sites (or a two-node cluster’s nodes) lose contact, so the right side keeps running automatically."},{term:"Zookeeper",def:"Stores the cluster’s configuration. It runs on 3 nodes (5 at redundancy factor 3) and needs a majority of them up to operate."},{term:"AIOps",full:"Artificial intelligence for IT operations",def:"In Cloud Manager (NCM), Intelligent Operations: it learns each VM’s normal behavior, flags what falls outside it and forecasts when capacity runs out."},{term:"Canary",def:"One small cluster upgraded first, so a failed health check stops a rollout before the rest of the fleet is touched."},{term:"Cluster API",def:"The upstream Kubernetes project NKP uses to create, upgrade and scale clusters from declared settings."},{term:"Cost Governance",def:"The Cloud Manager (NCM) component, formerly Beam, that meters cost and keeps budgets and savings recommendations."},{term:"FSVM",full:"File Server VM",def:"The VMs that run a Nutanix Files file server and serve its shares, spread across the cluster’s nodes."},{term:"HCI",full:"Hyperconverged infrastructure",def:"Compute and storage software running together on standard servers, pooled into one cluster, instead of separate servers, a SAN and a storage array."},{term:"LACP",full:"Link Aggregation Control Protocol",def:"A standard way to bond a host’s network links with the switch so traffic can use the links together."},{term:"NAI",full:"Nutanix Enterprise AI",def:"Nutanix software for deploying and managing AI model inference endpoints on Kubernetes."},{term:"NCI",full:"Nutanix Cloud Infrastructure",def:"The infrastructure layer: AOS storage, the AHV hypervisor, Flow networking and security, and disaster recovery."},{term:"NIM",full:"NVIDIA Inference Microservices",def:"NVIDIA’s packaged, optimized model containers, which Nutanix Enterprise AI can deploy."},{term:"NKP Metal",def:"The NKP option for running Kubernetes directly on bare-metal servers, without a hypervisor; in early access."},{term:"Nutanix Central",def:"The console above many Prism Central instances: one place to see and manage every region and site. Offered as SaaS and on-premises."},{term:"NUS",full:"Nutanix Unified Storage",def:"Files, Objects and Volumes on one platform: file shares, S3-compatible object storage and block storage over iSCSI."},{term:"ROBO",full:"Remote office / branch office",def:"Small sites away from the data center, often run on one-, two- or three-node clusters."},{term:"Security Compliance",def:"The Cloud Manager (NCM) component, formerly Security Central, that checks settings against a baseline and catches drift."},{term:"SED",full:"Self-encrypting drive",def:"A drive that encrypts data in its own hardware, with its keys held by a key manager."},{term:"Self-Service",def:"The Cloud Manager (NCM) component, formerly Calm, that offers a catalog of blueprints with quotas and approvals."},{term:"UBA",full:"User behavior analytics",def:"In Data Lens, learning how users normally access files and flagging unusual access, such as many files encrypted in a short time."},{term:"VPC",full:"Virtual private cloud",def:"With Flow Virtual Networking, a private network built in software, with its own subnets and routing, kept apart from other VPCs."},{term:"WORM",full:"Write once, read many",def:"A setting that stops data from being changed or deleted for a set retention period, used against ransomware and for compliance."},{term:"SAN",full:"Storage area network",def:"A separate network, usually Fibre Channel or iSCSI, that connects servers to a shared storage array."},{term:"HBA",full:"Host bus adapter",def:"The card in a server that connects it to a Fibre Channel storage network."},{term:"LUN",full:"Logical unit number",def:"A slice of an array’s storage that hosts see as one disk."},{term:"Fibre Channel",def:"The specialized storage network a traditional SAN runs on, with its own switches, cabling and skills."},{term:"Zoning / LUN masking",def:"SAN settings that decide which hosts reach which array ports (zoning, on the switches) and which LUNs they see (masking, on the array)."},{term:"Prism",def:"The Nutanix management console: Prism Element is built into every cluster, and Prism Central manages many clusters."},{term:"Content cache",def:"The read cache in each CVM’s memory (the Nutanix Bible calls it the unified cache). Data read once is kept briefly; data read again stays longer."},{term:"Extent store",def:"Where data lives long term, on each node’s drives. The OpLog drains into it, and large sequential writes go straight to it."},{term:"Snapshot",def:"A read-only point-in-time copy of a virtual disk, made by copying its map of blocks, not the data. A local restore point, not a backup."},{term:"Clone",def:"A new writable disk made from a snapshot’s map, sharing every block with it until a block changes."},{term:"Redirect-on-write",def:"After a snapshot, new writes go to new blocks and only the live disk’s map changes, so the snapshot keeps pointing at the old blocks."},{term:"Block awareness",def:"Placement that keeps the copies of each piece of data in different blocks (chassis), so a whole block can fail without losing data."},{term:"OVS",full:"Open vSwitch",def:"The virtual switch software on every AHV host."},{term:"LAG",full:"Link aggregation group",def:"Two or more switch ports combined into one link, the switch side of LACP. MLAG and vPC spread it across two switches."},{term:"MTU",full:"Maximum transmission unit",def:"The largest packet a network link carries. Overlay networks add a header, so they need a larger MTU underneath."},{term:"Geneve",full:"Generic Network Virtualization Encapsulation",def:"The envelope Flow Virtual Networking wraps around VPC traffic between hosts."},{term:"NAT",full:"Network address translation",def:"Swapping a private address for a public one. Source NAT lets many VMs share an address; a floating IP maps one public address to one VM."},{term:"NearSync",def:"Asynchronous replication with recovery points every 1 to 15 minutes."},{term:"STIG",full:"Security Technical Implementation Guide",def:"A hardening checklist from the US Defense Information Systems Agency (DISA). Nutanix publishes one for AOS."},{term:"FIPS 140",full:"Federal Information Processing Standard 140",def:"The US standard for validating cryptographic modules, such as those that encrypt data at rest."},{term:"iSCSI",def:"Block storage over ordinary Ethernet; Nutanix Volumes serves disks to outside hosts this way."},{term:"NFS / SMB",def:"The two file-sharing protocols: NFS for Linux and UNIX clients, SMB for Windows. Nutanix Files serves both."},{term:"S3",def:"The object storage API defined by Amazon. Nutanix Objects is S3-compatible."},{term:"Time Machine",def:"NDB’s protection for each database: snapshots plus captured transaction logs, so any moment in the retention window can be restored or cloned."},{term:"Data Lens",def:"Nutanix’s data security service for Files and Objects: spots ransomware and unusual access, keeps audit trails and helps recovery. SaaS or on-premises."},{term:"GA",full:"General availability",def:"A release open to every customer, rather than early access or a tech preview."},{term:"LLM",full:"Large language model",def:"The kind of AI model Nutanix Enterprise AI serves through an inference endpoint."},{term:"MCP",full:"Model Context Protocol",def:"The open protocol AI agents use to call tools; Nutanix Enterprise AI’s MCP Gateway governs that access."},{term:"EKS",full:"Amazon Elastic Kubernetes Service",def:"AWS’s managed Kubernetes, where Cloud Native AOS 1.0 runs."},{term:"VCF / VVF",full:"VMware Cloud Foundation / vSphere Foundation",def:"The two subscription bundles Broadcom sells vSphere in."},{term:"SDC",full:"Dell Storage Data Client",def:"The client that lets Nutanix compute nodes reach Dell PowerFlex storage."}],jA=`ISC License
