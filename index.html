<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Nutanix Architecture Explorer</title>
    <script>
      try { if (localStorage.getItem('nax-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This explorer needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
